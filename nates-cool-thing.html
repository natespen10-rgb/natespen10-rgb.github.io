<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nate's Cool Thing</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--panel:#161a2e;--line:#262b48;--text:#e8eaf6;--dim:#8a90b8;--a:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{padding:26px 24px 10px;max-width:1180px;margin:auto}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(18px,3vw,28px);margin:0;color:var(--a);letter-spacing:1px;text-shadow:3px 3px 0 #b23a65}
.tag{color:var(--dim);margin:10px 0 0;font-size:14px}
main{max-width:1180px;margin:auto;padding:10px 24px 40px}
.player{margin-bottom:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar b{font-size:18px}
.btn{font:700 14px Inter,sans-serif;background:#0f1224;color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--a)}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <h1>NATE'S COOL THING 😎</h1>
  <p class="tag">1 game</p>
</header>
<main>
  <section class="player">
    <div class="bar"><b>🎮 Game 1</b><button class="btn fs">⛶ Fullscreen</button></div>
    <div class="frame">
      <iframe name="innerFrame5" src="https://games.gdevelop-app.com/game-4d552f62-9d68-4d6b-bbc6-905cf32be11a/index.html?gdevAdsValidityToken=pJT%2F%2BhKpUKKh3KhB&amp;gdevPlatformInfo=1_eyJlYW4iOiJnZGdhbWVzLXdlYi1hcHAiLCJlYXYiOiIiLCJhZGciOmZhbHNlfQ" allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; keyboard-map *; focus-without-user-activation *; screen-wake-lock; clipboard-read; clipboard-write" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts allow-same-origin allow-popups-to-escape-sandbox allow-downloads" scrolling="no" allowfullscreen="" style="width: 100%; height: 100%;"></iframe>
    </div>
  </section>
</main>
<script>
document.querySelectorAll('.fs').forEach(b=>b.onclick=()=>{const f=b.closest('.player').querySelector('.frame');(f.requestFullscreen||f.webkitRequestFullscreen||function(){}).call(f)});
</script>
</body>
</html>
