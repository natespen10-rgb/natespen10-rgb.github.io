<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nate's Cool Thing</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--panel:#161a2e;--line:#262b48;--text:#e8eaf6;--dim:#8a90b8;--a:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{padding:26px 24px 10px;max-width:1180px;margin:auto}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(18px,3vw,28px);margin:0;color:var(--a);letter-spacing:1px;text-shadow:3px 3px 0 #b23a65}
.tag{color:var(--dim);margin:10px 0 0;font-size:14px}
main{max-width:1180px;margin:auto;padding:10px 24px 40px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar b{font-size:18px}
.btn{font:700 14px Inter,sans-serif;background:#0f1224;color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--a)}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <h1>NATE'S COOL THING 😎</h1>
  <p class="tag">1 game</p>
</header>
<main>
  <section class="player">
    <div class="bar"><b>🎮 Game</b><button class="btn" id="fs">⛶ Fullscreen</button></div>
    <div class="frame" id="frame">
      <iframe id="innerFrame" name="innerFrame" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-storage-access-by-user-activation" frameborder="0" allowfullscreen="" src="https://880715904-atari-embeds.googleusercontent.com/embeds/9a0a136a6ed5f92b1c914a0fb8b81cd6/inner-frame-minified.html?jsh=m%3B%2F_%2Fscs%2Fabc-static%2F_%2Fjs%2Fk%3Dgapi.lb.en.smUXTMp7CeY.O%2Fd%3D1%2Frs%3DAHpOoo_-UMASGI-dbLvJPxfO6N46l3l46A%2Fm%3D__features__" style="overflow: auto;"></iframe>
    </div>
  </section>
</main>
<script>
document.getElementById('fs').onclick=()=>{const f=document.getElementById('frame');(f.requestFullscreen||f.webkitRequestFullscreen||function(){}).call(f)};
</script>
</body>
</html>
