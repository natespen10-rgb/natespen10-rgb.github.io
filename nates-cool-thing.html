  const MV={punch:{dur:18,a0:5,a1:9,rx:20,ry:-74,rw:44,rh:18,dmg:7,kb:4,st:12},kick:{dur:28,a0:10,a1:16,rx:14,ry:-46,rw:58,rh:20,dmg:11,kb:7,st:18},shoot:{dur:22}};
  let F,proj,sparks,rnd,wins,timer,state,banner,bannerT,fr=0;
  const mk=(x0,col,k,face)=>({x:x0,y:GY,vx:0,vy:0,face,hp:100,en:20,act:null,t:0,hit:false,stun:0,col,k,blk:false});
  const newRound=()=>{F=[mk(220,'#3ee0cf',{l:'KeyA',r:'KeyD',j:'KeyW',b:'KeyS',p:'KeyF',kk:'KeyG',s:'KeyH'},1),mk(500,'#ff5d8f',{l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp',b:'ArrowDown',p:'KeyK',kk:'KeyL',s:'Semicolon'},-1)];
    proj=[];sparks=[];timer=60*60;state='intro';banner='ROUND '+rnd;bannerT=90;hud()};
  const hud=()=>say(state=='match'?(wins[0]>wins[1]?'Cyan':'Pink')+' wins the match '+wins[0]+'–'+wins[1]+'! Space for a rematch':'Round '+rnd+' · Cyan '+wins[0]+' — '+wins[1]+' Pink · best of 3');
  const reset=()=>{rnd=1;wins=[0,0];newRound()};
  const act=(f,m)=>{if(f.act||f.stun||f.blk)return;if(m=='shoot'){if(f.en<50)return;f.en-=50;proj.push({x:f.x+f.face*34,y:f.y-66,vx:f.face*8,o:f})}f.act=m;f.t=0;f.hit=false};
  this.key=k=>{if(state=='match'){if(k=='Space')reset();return}if(state!='fight')return;F.forEach(f=>{if(k==f.k.p)act(f,'punch');else if(k==f.k.kk)act(f,'kick');else if(k==f.k.s)act(f,'shoot')})};
  const hurt=o=>({x:o.x-18,y:o.y-100,w:36,h:100});
  const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const applyHit=(a,o,dmg,kb,st,px,py)=>{const blocked=o.blk&&o.face==(a.x>o.x?1:-1);
    if(blocked){o.hp-=dmg*.15;o.vx=-o.face*kb*.5;o.en=Math.min(100,o.en+4);sparks.push({x:px,y:py,t:12,col:'#c9cbd6'})}
    else{o.hp-=dmg;o.stun=st;o.vx=(a.x<o.x?1:-1)*kb;if(dmg>=11)o.vy=-5;o.act=null;a.en=Math.min(100,a.en+10);o.en=Math.min(100,o.en+6);sparks.push({x:px,y:py,t:16,col:'#ffd23f'})}
    o.hp=Math.max(0,o.hp)};
  const upd=(f,o)=>{const on=f.y>=GY;
    if(f.stun>0){f.stun--;f.vx*=.88;f.blk=false}
    else if(f.act){f.t++;const mv=MV[f.act];
      if(mv.a0&&f.t>=mv.a0&&f.t<=mv.a1&&!f.hit){const hb={x:f.face>0?f.x+mv.rx:f.x-mv.rx-mv.rw,y:f.y+mv.ry,w:mv.rw,h:mv.rh};
        if(ov(hb,hurt(o))){f.hit=true;applyHit(f,o,mv.dmg,mv.kb,mv.st,hb.x+hb.w/2,hb.y+hb.h/2)}}
      if(on)f.vx*=.7;if(f.t>=mv.dur)f.act=null}
    else{f.blk=!!keys[f.k.b]&&on;const dir=(keys[f.k.r]?1:0)-(keys[f.k.l]?1:0);if(on)f.vx=f.blk?0:dir*4.2;else f.vx+=dir*.3;
      if(keys[f.k.j]&&on&&!f.blk)f.vy=-13;f.face=o.x>f.x?1:-1}
    f.vy+=.7;f.x+=f.vx;f.y+=f.vy;if(f.y>GY){f.y=GY;f.vy=0}f.x=Math.max(30,Math.min(W-30,f.x))};
  reset();
  loop(()=>{
    fr++;
    if(state=='intro'){if(--bannerT<=0){state='fight';banner='FIGHT!';bannerT=40}}
    else if(state=='fight'){
      upd(F[0],F[1]);upd(F[1],F[0]);
      const[a,b]=F;if(Math.abs(a.x-b.x)<40&&Math.abs(a.y-b.y)<90){const o=(40-Math.abs(a.x-b.x))/2*Math.sign(b.x-a.x||1);a.x-=o;b.x+=o}
      proj.forEach(p=>{p.x+=p.vx;const tg=F.find(f=>f!=p.o);if(!p.done&&ov({x:p.x-12,y:p.y-12,w:24,h:24},hurt(tg))){p.done=true;applyHit(p.o,tg,15,8,20,p.x,p.y)}});
      proj=proj.filter(p=>!p.done&&p.x>-30&&p.x<W+30);
      if(bannerT>0)bannerT--;timer--;
      if(F.some(f=>f.hp<=0)||timer<=0){const w=F[0].hp==F[1].hp?-1:F[0].hp>F[1].hp?0:1;if(w>=0)wins[w]++;
        banner=timer<=0?'TIME!':'K.O.!';bannerT=130;state='ko';hud()}}
    else if(state=='ko'){F.forEach(f=>{f.vy+=.7;f.y=Math.min(GY,f.y+f.vy);f.x+=f.vx;f.vx*=.9});if(--bannerT<=0){if(wins[0]>=2||wins[1]>=2){state='match';banner=(wins[0]>wins[1]?'CYAN':'PINK')+' WINS!';hud()}else{rnd++;newRound()}}}
    sparks.forEach(s=>s.t--);sparks=sparks.filter(s=>s.t>0);
    const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#2a1747');sky.addColorStop(1,'#d9566e');x.fillStyle=sky;x.fillRect(0,0,W,H);
    x.fillStyle='#ffb03f';x.beginPath();x.arc(W/2,GY-40,70,0,7);x.fill();
    x.fillStyle='#1a1030';for(let i=0;i<W;i+=48){const bh=60+((i*37)%90);x.fillRect(i,GY-bh,40,bh)}
    x.fillStyle='#2b2140';x.fillRect(0,GY,W,H-GY);x.fillStyle='#3a2d55';x.fillRect(0,GY,W,4);
    F.forEach(f=>{const X=f.x,Y=f.y,d=f.face,flash=f.stun>0&&fr%6<3;const col=flash?'#fff':f.col;
      x.lineCap='round';x.strokeStyle=col;x.lineWidth=9;
      const walk=Math.abs(f.vx)>.5&&Y>=GY?Math.sin(fr/4)*10:0;x.beginPath();
      if(f.act=='kick'&&f.t>=7&&f.t<=18){x.moveTo(X,Y-44);x.lineTo(X-d*8,Y);x.moveTo(X,Y-44);x.lineTo(X+d*60,Y-40)}
      else{x.moveTo(X,Y-44);x.lineTo(X-8+walk,Y);x.moveTo(X,Y-44);x.lineTo(X+8-walk,Y)}x.stroke();
      x.fillStyle=col;x.fillRect(X-13,Y-88,26,46);
      x.beginPath();
      if(f.act=='punch'&&f.t>=3&&f.t<=11){x.moveTo(X,Y-76);x.lineTo(X+d*58,Y-70);x.moveTo(X,Y-76);x.lineTo(X-d*10,Y-56)}
      else if(f.act=='shoot'){x.moveTo(X,Y-76);x.lineTo(X+d*36,Y-68);x.moveTo(X,Y-74);x.lineTo(X+d*36,Y-62)}
      else if(f.blk){x.moveTo(X,Y-76);x.lineTo(X+d*18,Y-96);x.moveTo(X,Y-72);x.lineTo(X+d*20,Y-86)}
      else{x.moveTo(X,Y-78);x.lineTo(X+d*18,Y-58);x.moveTo(X,Y-78);x.lineTo(X-d*14,Y-56)}x.stroke();
      x.fillStyle='#f1c9a5';x.beginPath();x.arc(X,Y-100,14,0,7);x.fill();x.fillStyle=f.col;x.fillRect(X-14,Y-112,28,7);
      x.fillStyle='#111';x.fillRect(X+d*5-2,Y-103,4,4);
      if(f.blk){x.strokeStyle='rgba(155,231,255,.6)';x.lineWidth=3;x.beginPath();x.arc(X+d*10,Y-70,40,-1.2*d+(d<0?Math.PI:0),1.2*d+(d<0?Math.PI:0),d<0);x.stroke()}});
    proj.forEach(p=>{x.fillStyle=p.o.col;x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,6,0,7);x.fill()});
    sparks.forEach(s=>{x.strokeStyle=s.col;x.lineWidth=3;for(let i=0;i<6;i++){const a=i*1.05+s.t;x.beginPath();x.moveTo(s.x+Math.cos(a)*(16-s.t),s.y+Math.sin(a)*(16-s.t));x.lineTo(s.x+Math.cos(a)*(26-s.t),s.y+Math.sin(a)*(26-s.t));x.stroke()}});
    F.forEach((f,i)=>{const bx=i?W-30-280:30;x.fillStyle='#111';x.fillRect(bx,18,280,16);x.fillStyle=f.hp>30?f.col:'#e0506f';
      const w=280*f.hp/100;x.fillRect(i?bx+280-w:bx,18,w,16);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(bx,18,280,16);
      x.fillStyle='#111';x.fillRect(bx,38,160*1,6);x.fillStyle=f.en>=50?'#ffd23f':'#8a7a30';x.fillRect(i?bx+280-160*f.en/100:bx,38,160*f.en/100,6);
      for(let k=0;k<2;k++){x.fillStyle=k<wins[i]?'#ffd23f':'#333';x.beginPath();x.arc(i?bx+260-k*16:bx+20+k*16,58,5,0,7);x.fill()}});
    x.fillStyle='#fff';x.font='18px "Press Start 2P",monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(Math.max(0,Math.ceil(timer/60)),W/2,28);
    if(bannerT>0||state=='match'){x.fillStyle='#ffd23f';x.font='30px "Press Start 2P",monospace';x.fillText(banner,W/2,H/2-30)}
  });
}},
/* ---------- FLOPPY SPORTS ---------- */
{id:'fhoops',name:'Floppy Hoops',icon:'🏀',p:2,desc:'Wobbly one-button basketball, 2 vs 2. Every point brings a random twist like moon gravity or a giant ball!',help:'Cyan presses <kbd>W</kbd> · Pink presses <kbd>↑</kbd> · that\'s it!<br>Your key makes both of your players jump and swing their arms · they lean and wobble, so time your jumps · first to 5',start:floppy('hoops')},
{id:'ffooty',name:'Floppy Footy',icon:'🥅',p:2,desc:'Wobbly one-button soccer, 2 vs 2. Every goal brings a random twist like slippery ice or super bouncy balls!',help:'Cyan presses <kbd>W</kbd> · Pink presses <kbd>↑</kbd> · that\'s it!<br>Your key makes both of your players jump and swing their arms · knock the ball into the other goal · first to 5',start:floppy('footy')},
{id:'fvolley',name:'Floppy Volley',icon:'🏐',p:2,desc:'Wobbly one-button beach volleyball, 2 vs 2. Every point brings a random twist like wind gusts or mega jumps!',help:'Cyan presses <kbd>W</kbd> · Pink presses <kbd>↑</kbd> · that\'s it!<br>Keep the ball off your sand and get it to land on theirs · first to 5',start:floppy('volley')},
/* ---------- ROCK PAPER SCISSORS ---------- */
{id:'rps',name:'Rock Paper Scissors',icon:'✊',p:2,desc:'Both pick in secret on one keyboard, then reveal.',help:'Player 1: <kbd>A</kbd> rock · <kbd>S</kbd> paper · <kbd>D</kbd> scissors<br>Player 2: <kbd>J</kbd> rock · <kbd>K</kbd> paper · <kbd>L</kbd> scissors',
start(){
  const el=box('rps');
  const E=['✊','✋','✌️'],N=['Rock','Paper','Scissors'];
  let a=null,b=null,s1=0,s2=0;
  const draw=res=>{el.innerHTML=`<div class="hand"><small>PLAYER 1</small><span>${res?E[a]:a!=null?'✅':'❔'}</span></div><div class="vs">VS</div><div class="hand"><small>PLAYER 2</small><span>${res?E[b]:b!=null?'✅':'❔'}</span></div>`};
  const hud=m=>say(m+' · P1 '+s1+' — '+s2+' P2');
  const m1={KeyA:0,KeyS:1,KeyD:2},m2={KeyJ:0,KeyK:1,KeyL:2};
  this.key=k=>{
    if(a!=null&&b!=null){a=b=null;draw();hud('Pick your moves!');return}
    if(k in m1&&a==null)a=m1[k];else if(k in m2&&b==null)b=m2[k];else return;
    if(a!=null&&b!=null){const r=(a-b+3)%3;let m;
      if(!r)m='Tie! Both picked '+N[a];else if(r==1){s1++;m=N[a]+' beats '+N[b]+' — Player 1 wins'}else{s2++;m=N[b]+' beats '+N[a]+' — Player 2 wins'}
      draw(1);hud(m+' · any key for next round')}
    else{draw();hud(a!=null?'Player 1 is locked in…':'Player 2 is locked in…')}
  };
  draw();hud('Pick your moves!');
}},
];

let filt='all';
$('#tag').textContent=G.length+' games · nothing to download · play solo or with a friend on one keyboard';
function renderGrid(){
  const g=$('#grid');g.innerHTML='';
  G.filter(x=>filt=='all'||x.p==+filt).forEach(x=>{
    const b=document.createElement('button');b.className='card';const bs=store.get(x.id);
    b.innerHTML=`<div class="icon">${x.icon}</div><span class="pill ${x.p==2?'two':''}">${x.p==2?'2 PLAYERS':'1 PLAYER'}</span><h3>${x.name}</h3><p>${x.desc}</p>${x.p==1&&bs?`<span class="best">Best: ${bs}${x.unit||''}</span>`:''}`;
    b.onclick=()=>{location.hash=x.id};g.appendChild(b);
  });
}
document.querySelectorAll('.tabs button').forEach(t=>t.onclick=()=>{
  filt=t.dataset.f;document.querySelectorAll('.tabs button').forEach(y=>y.classList.toggle('on',y==t));
  if(cur)location.hash='';else renderGrid();
});
function open(g){
  clearTimers();$('#stage').innerHTML='';say('');cur=g;g.key=null;
  $('#home').style.display='none';$('#play').style.display='block';
  $('#gname').textContent=g.icon+' '+g.name;$('#help').innerHTML=g.help;
  g.start();scrollTo(0,0);if(document.activeElement)document.activeElement.blur();
}
function home(){clearTimers();cur=null;$('#stage').innerHTML='';$('#play').style.display='none';$('#home').style.display='block';renderGrid()}
function route(){const g=G.find(x=>x.id==location.hash.slice(1));g?open(g):home()}
addEventListener('hashchange',route);
$('#back').onclick=()=>{location.hash=''};
$('#restart').onclick=()=>{if(cur)open(cur)};
route();
</script>
