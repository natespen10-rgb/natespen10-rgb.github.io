<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nate's Cool Thing</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--panel:#161a2e;--line:#262b48;--text:#e8eaf6;--dim:#8a90b8;--a:#ffd23f;--b:#3ee0cf;--c:#ff5d8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{padding:26px 24px 10px;max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(18px,3vw,28px);margin:0;color:var(--a);letter-spacing:1px;text-shadow:3px 3px 0 #b23a65;cursor:pointer}
.tag{color:var(--dim);margin:10px 0 0;font-size:14px}
.btn{font:600 14px Inter,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--a)}
.search{position:relative;flex:0 1 340px}
.search input{width:100%;font:500 15px Inter,sans-serif;padding:11px 14px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
.search input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,210,63,.15)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
main{max-width:1180px;margin:auto;padding:10px 24px 40px}
.feat{position:relative;display:flex;align-items:center;gap:28px;padding:30px 34px;border-radius:22px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line);
  background:radial-gradient(circle at 85% 50%,color-mix(in srgb,var(--c) 45%,transparent),transparent 55%),linear-gradient(120deg,#171b33,#0d0f1a)}
.feat::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.feat .fi{font-size:110px;line-height:1;filter:drop-shadow(0 10px 30px var(--c));order:2;margin-left:auto;animation:fbob 3s ease-in-out infinite}
@keyframes fbob{50%{transform:translateY(-8px) rotate(-3deg)}}
.feat small{font-weight:800;letter-spacing:2px;color:var(--c);font-size:12px}
.feat h2{margin:6px 0 8px;font-size:clamp(24px,4vw,38px);line-height:1.1}
.feat p{margin:0 0 18px;color:#c8cbe6;max-width:520px;line-height:1.5}
.feat .go{background:var(--c);color:#111;border:0;font:800 16px Inter,sans-serif;padding:12px 26px;border-radius:999px;cursor:pointer;box-shadow:0 6px 20px color-mix(in srgb,var(--c) 50%,transparent)}
.feat .go:hover{filter:brightness(1.1);transform:translateY(-1px)}
.feat .dots{display:flex;gap:6px;margin-top:16px}.feat .dots i{width:8px;height:8px;border-radius:50%;background:#33395e;cursor:pointer}.feat .dots i.on{background:var(--c);width:22px;border-radius:4px}
.bar2{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%,transparent);padding:10px 0 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.cats button{font:700 14px Inter,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:12px;cursor:pointer;display:flex;gap:7px;align-items:center;transition:transform .1s}
.cats button:hover{transform:translateY(-2px);border-color:var(--c,var(--a))}
.cats button.on{background:var(--c,var(--a));color:#111;border-color:transparent}
.cats b{font-size:11px;opacity:.6}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font:700 13px Inter,sans-serif;background:none;border:0;color:var(--dim);padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:#2a3058;color:var(--text)}
.sec{margin:8px 0 30px}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sech h3{margin:0;font-size:21px}.sech span{color:var(--dim);font-size:13px}
.sech button{margin-left:auto;background:none;border:0;color:var(--c,var(--a));font:700 13px Inter,sans-serif;cursor:pointer}
.sech button:hover{text-decoration:underline}
.catban{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:18px;margin-bottom:18px;background:linear-gradient(110deg,color-mix(in srgb,var(--c) 30%,#161a2e),#161a2e 70%);border:1px solid var(--line)}
.catban span{font-size:48px}.catban h3{margin:0;font-size:24px}.catban p{margin:2px 0 0;color:#c8cbe6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,260px);gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;overflow:hidden}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 12px 30px -10px var(--c);outline:none}
.cover{height:118px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--c) 60%,transparent),transparent 70%),linear-gradient(160deg,#1c2142,#0d0f1f);overflow:hidden}
.cover::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.5px);background-size:14px 14px}
.cover .ico{font-size:58px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));transition:transform .2s;position:relative}
.card:hover .ico{transform:scale(1.15) rotate(-6deg)}
.new{position:absolute;top:10px;left:10px;background:var(--a);color:#111;font:800 10px Inter,sans-serif;padding:3px 8px;border-radius:6px;letter-spacing:1px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--dim);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px;align-items:center}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#22284a;color:var(--b)}
.pill.two{color:var(--c2,#ff5d8f)}.pill.cat{color:var(--c);background:color-mix(in srgb,var(--c) 14%,#161a2e)}
.best{font-size:12px;color:var(--a);font-weight:700;margin-left:auto}
.empty{color:var(--dim);text-align:center;padding:50px 0;font-size:16px}
@media (max-width:640px){.bar2{position:static}.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.cats button{flex:none}.feat{flex-direction:column;align-items:flex-start;padding:22px}.feat .fi{order:0;margin:0;font-size:80px}.search{flex:1 1 100%}}
/* ===== Starfall Saga ===== */
.sf{width:min(1000px,98vw);user-select:none;position:relative}
.sftitle{position:relative;min-height:520px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(ellipse at 50% 120%,#5a3a9a,#1a1040 45%,#06040f 80%);border:1px solid var(--line)}
.sfstars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:sftw 3s infinite}
.sfstars i:nth-child(3n){width:2px;height:2px;animation-delay:1s}.sfstars i:nth-child(4n){animation-delay:2s}
.sfstars i:nth-child(1){left:8%;top:12%}.sfstars i:nth-child(2){left:22%;top:30%}.sfstars i:nth-child(3){left:35%;top:8%}.sfstars i:nth-child(4){left:48%;top:22%}.sfstars i:nth-child(5){left:61%;top:10%}.sfstars i:nth-child(6){left:74%;top:28%}.sfstars i:nth-child(7){left:88%;top:14%}.sfstars i:nth-child(8){left:94%;top:40%}.sfstars i:nth-child(9){left:5%;top:50%}.sfstars i:nth-child(10){left:16%;top:70%}
.sfstars i:nth-child(11){left:28%;top:55%}.sfstars i:nth-child(12){left:42%;top:80%}.sfstars i:nth-child(13){left:56%;top:62%}.sfstars i:nth-child(14){left:69%;top:84%}.sfstars i:nth-child(15){left:82%;top:66%}.sfstars i:nth-child(16){left:91%;top:88%}.sfstars i:nth-child(17){left:12%;top:90%}.sfstars i:nth-child(18){left:33%;top:40%}.sfstars i:nth-child(19){left:66%;top:45%}.sfstars i:nth-child(20){left:78%;top:5%}
.sfstars i:nth-child(n+21){left:calc(var(--x,50)*1%);top:50%;opacity:.4}
@keyframes sftw{50%{opacity:.2;transform:scale(.6)}}
.sflogo{font-size:84px;filter:drop-shadow(0 0 30px #ffd23f);animation:fbob 3s ease-in-out infinite}
.sftitle h2{margin:0;font:400 clamp(22px,4vw,38px) 'Press Start 2P',monospace;color:#ffe9a8;text-shadow:0 0 18px #ffb84a,4px 4px 0 #6a3aa8}
.sftitle p{color:#cfc6ff;line-height:1.7;margin:0 16px}
.sfbtns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sfbig{font-size:17px;padding:13px 30px;background:linear-gradient(#ffd23f,#e0a020);color:#2a1600;border:0;font-weight:800;box-shadow:0 6px 20px rgba(255,190,60,.35)}
.sfbig.ghost{background:transparent;color:#ffe9a8;border:2px solid #ffe9a8;box-shadow:none}
.sftop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(90deg,#241a4a,#161a2e);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.sftop>b{font-family:'Press Start 2P',monospace;font-size:11px;color:#ffe9a8}
.sftop nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sfnav{font:700 13px Inter,sans-serif;background:#0f1224;color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:10px;cursor:pointer}
.sfnav.on{background:#ffd23f;color:#111;border-color:#ffd23f}.sfnav em{font-style:normal;background:#ff5d8f;color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.sfmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sfreg{border-radius:16px;padding:16px;background:linear-gradient(150deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.sfreg.cur{border-color:#ffd23f;box-shadow:0 0 24px rgba(255,210,63,.25)}.sfreg.locked{filter:grayscale(.8) brightness(.5)}
.sfri{font-size:44px;position:absolute;right:12px;top:8px;opacity:.9;filter:drop-shadow(0 4px 8px #000)}
.sfrt b{font-size:18px;display:block}.sfrt small{color:#d8d8f0}
.sfstages{display:flex;align-items:center}.sfstages>i{flex:1;height:3px;background:rgba(255,255,255,.25);min-width:8px}
.sfst{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:#0f1224;color:#fff;font:800 15px Inter,sans-serif;cursor:pointer;flex:none;transition:transform .1s}
.sfst:hover:not(:disabled){transform:scale(1.12)}.sfst:disabled{opacity:.35;cursor:default}.sfst.done{background:#ffd23f;color:#111;border-color:#ffd23f}
.sfst.boss{width:50px;height:50px;font-size:22px;background:#5a1020;border-color:#ff5d8f}.sfst.boss.done{background:#ffd23f}
.sfwin{margin-top:14px;padding:14px;border-radius:12px;background:#2a2410;border:1px solid #ffd23f;font-weight:700;text-align:center}
.sfpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.sfpanel h3{margin:0 0 10px}.sfpanel p{margin:0 0 10px}
.sfcols{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.sfcols>.sfpanel{flex:1 1 240px}.sfcols>.grow{flex:3 1 460px}
.sfinv{display:flex;flex-wrap:wrap;gap:6px}.sfinv span{background:#0f1224;border-radius:8px;padding:5px 9px;font-size:13px;cursor:help}
.sfshop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sfbuy{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:#0f1224;color:var(--text);font:inherit;cursor:pointer}
.sfbuy:hover:not(:disabled){border-color:#ffd23f}.sfbuy:disabled{opacity:.45;cursor:default}.sfbuy span{font-size:28px}.sfbuy b{font-size:13px}.sfbuy small{font-size:11px;color:var(--dim)}.sfbuy em{font-style:normal;font-weight:800;color:#ffd23f}
.sfbuy.gear{background:linear-gradient(#1a1f3e,#0f1224)}
.sfdim{color:var(--dim);font-size:13px}
.sfparty{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sfhero,.sfph{display:flex;gap:10px;align-items:center}
.sfport{width:56px;height:56px;border-radius:14px;background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--c) 55%,#222),#111);border:2px solid var(--c);display:grid;place-items:center;font-size:30px;flex:none}
.sfhi{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.sfhi small{color:var(--dim)}
.sfbar{position:relative;height:14px;background:#0a0b14;border-radius:7px;overflow:hidden;border:1px solid #000}
.sfbar span{position:absolute;inset:0 auto 0 0;transition:width .35s}.sfbar.hp span{background:linear-gradient(#6ff08c,#2aa84a)}.sfbar.mp span{background:linear-gradient(#7fb8ff,#2a62d0)}
.sfbar i{position:absolute;inset:0;font:800 10px/14px Inter,sans-serif;font-style:normal;text-align:center;text-shadow:0 1px 2px #000}
.sfxp{height:4px;background:#0a0b14;border-radius:2px;overflow:hidden}.sfxp span{display:block;height:100%;background:#ffd23f}
.sfstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.sfstats span{background:#0f1224;border-radius:8px;padding:6px 9px;font-size:13px}
.sfeq{display:flex;flex-direction:column;gap:6px}.sfeq label{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;color:var(--dim);font-weight:800}
.sfeq select{flex:1;font:600 13px Inter,sans-serif;background:#0f1224;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}
.sfsk{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.sfsk span{font-size:12px;background:#2a2050;border-radius:7px;padding:4px 8px;cursor:help}.sfsk span.lock{background:#141728;color:#5a6080}.sfsk small{color:#a99ad8}
.sfq{display:flex;flex-direction:column;gap:8px}.sfq>div{display:grid;grid-template-columns:170px 1fr auto;gap:4px 12px;align-items:center;background:#0f1224;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.sfq small{grid-column:1/3;color:#ffd23f}.sfq em{font-style:normal;color:var(--dim);font-size:13px;grid-row:1/3;grid-column:3}.sfq .btn{grid-row:1/3;grid-column:3}
.sfq .ready{border-color:#ffd23f}.sfq .done{opacity:.5}
.sfdlg{min-height:440px;border-radius:20px;padding:40px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:radial-gradient(ellipse at 50% 0,#3a2a6a,#0d0f1a 70%);border:1px solid var(--line)}
.sfdi{font-size:80px;animation:fbob 3s ease-in-out infinite}.sfdlg h3{margin:0 0 6px;font-size:26px;color:#ffe9a8}.sfdlg p{max-width:560px;line-height:1.7;margin:0;color:#ddd6ff;font-size:16px}.sfdlg .btn{margin-top:14px}
.sfbat{border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(var(--a),var(--b) 70%);border:1px solid var(--line);padding:12px;min-height:520px;display:flex;flex-direction:column;gap:10px}
.sfdeco{position:absolute;left:0;right:0;top:150px;font-size:54px;letter-spacing:18px;opacity:.13;white-space:nowrap;overflow:hidden;pointer-events:none}
.sfbh{display:flex;justify-content:space-between;align-items:center;font-weight:800;position:relative}
.sfmini{font:700 12px Inter,sans-serif;background:rgba(0,0,0,.4);color:var(--text);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 9px;margin-left:6px;cursor:pointer}.sfmini.on{background:#ffd23f;color:#111}
.sffoes{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;min-height:200px;align-items:flex-end;position:relative}
.sffoe{width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:14px;border:2px solid transparent;position:relative;transition:opacity .4s}
.sffoe .sfart{font-size:82px;line-height:1.1;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6));animation:sfidle 2.4s ease-in-out infinite}
.sffoe.boss{width:220px}.sffoe.boss .sfart{font-size:130px}.sffoe .sfbar{width:100%}
.sffoe.dead{opacity:0;pointer-events:none}.sffoe.act{border-color:rgba(255,93,143,.6)}
.sffoe.tg,.sfph.tg{cursor:crosshair;border-color:#ffd23f;background:rgba(255,210,63,.1);animation:sfpulse 1s infinite}
@keyframes sfpulse{50%{box-shadow:0 0 18px rgba(255,210,63,.5)}}@keyframes sfidle{50%{transform:translateY(-6px)}}
.sfss{min-height:18px;font-size:14px}
.sfparty2{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.sfph{flex:1 1 220px;background:rgba(10,12,22,.75);border:2px solid transparent;border-radius:14px;padding:8px;position:relative}
.sfph.act{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}.sfph.dead{opacity:.5}
.sfcmd{background:rgba(6,7,14,.85);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;min-height:140px}
.sflabel{font-weight:800;display:flex;align-items:center;gap:8px}
.sfacts{display:flex;gap:8px;flex-wrap:wrap}.sfacts .btn{border-radius:10px;padding:10px 16px;font-size:15px}.sfacts kbd{font-size:10px;margin-left:4px}
.sflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;max-height:190px;overflow:auto}
.sfopt{display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px;background:#161a2e;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;cursor:pointer}
.sfopt:hover:not(:disabled){border-color:#ffd23f}.sfopt:disabled{opacity:.4;cursor:default}.sfopt small{grid-column:1/3;color:var(--dim);font-size:11px}.sfopt em{font-style:normal;color:#7fb8ff;font-weight:800;font-size:12px}
.sflog{font-size:13px;color:#c8cbe6;line-height:1.5;min-height:60px}
.sfres{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}.sfres h3{margin:0;font-size:24px;color:#ffe9a8}.sfres p{margin:0}.sflv{color:#8ff0a8}
.sffx{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:800 22px Inter,sans-serif;white-space:nowrap;text-shadow:0 2px 3px #000,0 0 2px #000;animation:ddup 1s ease-out both;pointer-events:none;z-index:5}
.sffx.dmg{color:#fff}.sffx.big{color:#ffd23f;font-size:28px}.sffx.heal{color:#6ff08c}.sffx.mp{color:#7fb8ff}.sffx.buff{color:#ffe9a8;font-size:16px}.sffx.st{color:#ff9ad0;font-size:16px}
@media (max-width:640px){.sffoe{width:110px}.sffoe .sfart{font-size:60px}.sffoe.boss .sfart{font-size:90px}.sfq>div{grid-template-columns:1fr}.sfq em,.sfq .btn{grid-row:auto;grid-column:auto}}
/* ===== Neon Surge + Shadow Blade shared shell ===== */
.ne{position:relative;width:min(960px,98vw);user-select:none}
.ne canvas{width:100%;display:block;border-radius:14px;border:2px solid var(--line)}
.neui{position:absolute;inset:0;pointer-events:none}
.neov{pointer-events:auto;position:absolute;inset:0;border-radius:14px;background:rgba(4,5,14,.86);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;overflow:auto}
.neov h1{margin:0;font:400 clamp(26px,5vw,46px) 'Press Start 2P',monospace;color:#9ff0ff;text-shadow:0 0 18px #3ee0ff,0 0 40px #ff2a6d}
.neov.bl h1{color:#fff;text-shadow:0 0 14px #ff3a5a,4px 4px 0 #3a0a1a}
.neov h2{margin:0;font:400 clamp(18px,3.4vw,28px) 'Press Start 2P',monospace;color:#ff5d8f;text-shadow:0 0 14px #ff2a6d}.neov h2.win{color:#7dff6a;text-shadow:0 0 14px #3aff6a}
.neov p{margin:0;color:#c8cbe6}.nesub{color:#9aa0c8!important;font-size:14px}
.necards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.necard{position:relative;width:200px;min-height:220px;border-radius:16px;border:2px solid #3a4aa0;background:linear-gradient(160deg,#1a2050,#0a0d24);color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;transition:transform .12s,box-shadow .12s;animation:nepop .25s backwards}
.necard:nth-child(2){animation-delay:.06s}.necard:nth-child(3){animation-delay:.12s}
@keyframes nepop{from{transform:scale(.7);opacity:0}}
.necard:hover{transform:translateY(-6px);border-color:#9ff0ff;box-shadow:0 0 26px rgba(62,224,255,.45)}
.necard.new{border-color:#ffd23f}.necard i{position:absolute;top:8px;right:8px;font:800 10px Inter;font-style:normal;background:#ffd23f;color:#111;padding:2px 6px;border-radius:5px}
.necard span{font-size:46px;filter:drop-shadow(0 0 10px rgba(159,240,255,.5))}.necard b{font-size:17px}.necard small{color:#b8bfe8;font-size:13px;line-height:1.4}
.necard em{position:absolute;bottom:8px;font-style:normal;font-size:11px;color:#6a70a0;font-weight:800}
.nelv{color:#ffd23f;letter-spacing:2px;font-size:12px}
.nestats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.nestats div{background:#11152e;border:1px solid #2a3060;border-radius:12px;padding:10px 18px;min-width:90px}.nestats b{display:block;font-size:22px}.nestats small{color:#8a90b8}
.neicons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:24px}.neicons sub{font-size:11px;color:#ffd23f;font-weight:800}
.nebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.negod{background:linear-gradient(#ff5d8f,#c2185b);border:0;color:#fff;font-weight:800;box-shadow:0 0 18px rgba(255,42,109,.45)}.negod.big{font-size:20px;padding:14px 44px}
.nemenu{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;text-align:left}.nemenu>div{flex:1 1 380px;max-width:460px}.nemenu h3{margin:0 0 8px;display:flex;justify-content:space-between}
.necoins{color:#ffd23f}
.nepilots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nepilot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:12px;border:2px solid #2a3060;background:#0f1330;color:var(--text);font:inherit;cursor:pointer;position:relative}
.nepilot span{font-size:24px}.nepilot b{color:var(--c)}.nepilot small{color:#9aa0c8;font-size:11px;line-height:1.3}.nepilot em{font-style:normal;color:#ffd23f;font-weight:800;font-size:12px}
.nepilot.on{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}.nepilot.lock{opacity:.75}
.neshop{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;width:100%;max-width:900px}
.neup{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:12px;border:1px solid #2a3060;background:#0f1330;color:var(--text);font:inherit;cursor:pointer}
.neup:hover:not(:disabled){border-color:#ffd23f}.neup:disabled{opacity:.5;cursor:default}.neup span{font-size:24px}.neup b{font-size:12px}.neup small{font-size:10.5px;color:#9aa0c8}.neup em{font-style:normal;color:#ffd23f;font-weight:800;font-size:12px}
.blworlds{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.blw{flex:1 1 260px;max-width:300px;border-radius:16px;padding:12px;background:linear-gradient(160deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.12)}.blw h3{margin:0 0 10px;text-shadow:0 2px 4px #000}
.bllv{display:flex;align-items:center}.bllv>i{flex:1;height:3px;background:rgba(255,255,255,.4)}
.bln{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.55);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:transform .1s}
.bln:hover:not(:disabled){transform:scale(1.1)}.bln:disabled{opacity:.45;cursor:default}.bln b{font-size:14px}.bln small{font-size:8px}.bln.done{border-color:#ffd23f}.bln.boss{width:72px;height:72px;border-color:#ff5d8f}
.blsh{margin:6px 0 0}
#play{display:none}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bar h2{margin:0;font-size:22px;flex:1}
#status{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--a);min-height:20px;margin:8px 0 14px;line-height:1.7;text-align:center}
#stage{display:flex;justify-content:center}
canvas{background:#05060d;border:2px solid var(--line);border-radius:12px;max-width:100%;height:auto;touch-action:none}
.help{color:var(--dim);font-size:13px;margin-top:16px;text-align:center;line-height:2}
kbd{background:#22284a;border-radius:4px;padding:2px 7px;font-family:inherit;color:var(--text);border-bottom:2px solid #11142a}
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#1d2240;padding:10px;border-radius:12px;width:min(380px,90vw);aspect-ratio:1}
.g2048 div{border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,5vw,30px)}
.mine{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(430px,94vw)}
.mine button{aspect-ratio:1;border:0;border-radius:5px;background:#2a3058;font:800 17px Inter,sans-serif;cursor:pointer;color:var(--text);padding:0}
.mine button.open{background:#10132a;cursor:default}
.btn:disabled{opacity:.4;cursor:default}
.tdwrap{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.tdbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tdbar .on{border-color:var(--a);background:#2a2f55}
.sudwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.sudlv{display:flex;gap:8px}.sudlv .on{background:var(--a);color:#111;border-color:var(--a)}
.sud{display:grid;grid-template-columns:repeat(9,1fr);width:min(450px,94vw);background:#8a90b8;gap:1px;border:3px solid #8a90b8;border-radius:6px;overflow:hidden}
.sud button{aspect-ratio:1;border:0;padding:0;background:#161a2e;font:700 clamp(16px,4.5vw,24px) Inter,sans-serif;cursor:pointer;color:#3ee0cf}
.sud .gv{color:#e8eaf6}.sud .peer{background:#1f2442}.sud .same{background:#33407a}.sud .sel{background:#4a5598}.sud .bad{color:#ff5d8f}
.sud .br{margin-right:2px}.sud .bb{margin-bottom:2px}
.pad{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(450px,94vw)}
.pad button{padding:12px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:700 18px Inter,sans-serif;cursor:pointer}
.chess{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(480px,94vw);aspect-ratio:1;border-radius:8px;overflow:hidden;border:3px solid #262b48}
.chess button{border:0;padding:0;min-height:0;min-width:0;aspect-ratio:1;line-height:1;cursor:pointer;position:relative;display:grid;place-items:center;font-size:min(44px,9vw);font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',sans-serif}
.chess .lt{background:#e9d8b4}.chess .dk{background:#a9805b}.chess .lt2{background:#e9d8b4}.chess .dk2{background:#6b4b32}
.chess .last{box-shadow:inset 0 0 0 100px rgba(255,210,63,.35)}
.chess .sel{background:#f2d65b!important}.chess .chk{background:#e0506f!important}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 1px #000,0 1px 3px #000}.pb{color:#151515;text-shadow:0 0 1px rgba(255,255,255,.5)}
.chess .dot::after{content:'';width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28);position:absolute}
.chess .ring::after{content:'';position:absolute;inset:5%;border-radius:50%;border:5px solid rgba(0,0,0,.3)}
.disc{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;font-size:min(22px,4.5vw)}
.disc.r{background:#e0506f;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.5)}
.disc.b{background:#23232d;box-shadow:inset 0 -5px 0 rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.5)}
.bs{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.bscol{display:flex;flex-direction:column;align-items:center;gap:10px}.bscol h3,.bscol h4{margin:0}.bscol.pass p{color:var(--dim);margin:0}
.bsbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bsg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(360px,90vw);background:#0b1730;padding:4px;border-radius:8px}
.bsg.small{width:min(240px,70vw)}
.bsg>*{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:#173a6b;display:grid;place-items:center;font:800 14px Inter,sans-serif;color:#fff}
.bsg button{cursor:crosshair}.bsg button:hover{background:#2a5a9e}
.bsg .ship{background:#7b8299}.bsg .hit{background:#ff5d8f}.bsg .sunk{background:#7a1f3d}.bsg .miss{background:#10284d;color:#6d8bc0}
.dlog{width:min(640px,96vw);min-height:86px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.6;box-sizing:border-box}
.nono{border-collapse:collapse;user-select:none}
.nono td{width:calc(min(400px,74vw)/var(--n));height:calc(min(400px,74vw)/var(--n));border:1px solid #2a3058;background:#161a2e;cursor:pointer;padding:0;box-sizing:border-box}
.nono td.f{background:#3ee0cf}
.nono td.x::after{content:'✕';display:block;text-align:center;font-size:11px;color:#6d73a0}
.nono td.br{border-right:2px solid #8a90b8}.nono td.bb{border-bottom:2px solid #8a90b8}
.nono th{color:var(--text);font:700 12px Inter,sans-serif;padding:2px 4px}
.nono th.ch{vertical-align:bottom;line-height:1.25}.nono th.rh{text-align:right;white-space:nowrap}.nono th.ok{color:#454b75}
.chess .rv{background:#1f7a4a;box-shadow:inset 0 0 0 1px #155c37}
.disc.bk{background:#151515;box-shadow:inset 0 -4px 0 rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.5)}
.disc.wt{background:#f4f4f4;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.5)}
.manc{display:grid;grid-template-columns:1.2fr repeat(6,1fr) 1.2fr;grid-template-rows:auto auto;gap:10px;background:#6b4b32;padding:16px;border-radius:44px;width:min(700px,96vw);box-sizing:border-box}
.pit{aspect-ratio:1;border-radius:50%;background:#3b2a1e;border:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:14%;cursor:default;position:relative;box-sizing:border-box}
.pit.can{cursor:pointer;box-shadow:0 0 0 3px var(--a)}.pit.last{background:#4d3727}
.store{grid-row:span 2;border-radius:40px;background:#3b2a1e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 28px Inter,sans-serif;gap:6px}
.store small{font-size:11px;color:#e9d8b4;letter-spacing:1px}
.seed{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.cnt{position:absolute;bottom:-4px;right:-2px;background:#151515;color:#fff;font:800 12px Inter,sans-serif;border-radius:999px;padding:2px 6px}
.dive{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(580px,94vw);text-align:center}
.dive h2{margin:2px 0 6px;font-size:30px}.dive small{color:var(--dim);font-weight:600;letter-spacing:1px}
.dive form{display:flex;gap:8px;width:100%}
.dive input{flex:1;font:600 18px Inter,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);outline:none;min-width:0}
.dive input:focus{border-color:var(--a)}
.divebar{width:100%;height:8px;background:#1f2442;border-radius:999px;overflow:hidden}.divebar span{display:block;height:100%;background:var(--b);transition:width .1s linear}
.tierbig{font:800 32px Inter,sans-serif}.diverow{display:flex;justify-content:space-between;gap:12px;width:100%;padding:9px 14px;background:var(--panel);border-radius:10px;font-size:14px;box-sizing:border-box;text-align:left}
.diveTiers{font-size:13px;font-weight:700}
/* ===== Deck Delver ===== */
.dd{position:relative;width:min(980px,98vw);user-select:none}
.ddm{min-height:560px;position:relative}
.ddfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.ddf{position:absolute;font:800 22px Inter,sans-serif;color:#fff;text-shadow:0 2px 4px #000,0 0 2px #000;animation:ddup .95s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.ddf.dmg{color:#ff6b7f;font-size:26px}.ddf.blk{color:#8fc8ff}.ddf.st{color:#ffd23f;font-size:16px}.ddf.heal{color:#5ee07a}
@keyframes ddup{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-56px}}
.ddtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.ddrel{display:flex;gap:4px;flex:1;flex-wrap:wrap}.ddrel span{font-size:22px;cursor:help;filter:drop-shadow(0 2px 2px #000)}
.ddpots{display:flex;gap:4px}.ddpot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#0f1224;font-size:18px;cursor:pointer;padding:0;color:var(--dim)}
.ddpot:hover{border-color:var(--a)}.ddpot.empty{display:grid;place-items:center;cursor:default}
.ddsmall{padding:6px 10px;font-size:13px}
.ddbat{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;min-height:270px;padding:22px 16px 14px;margin-top:10px;border-radius:14px;
  background:radial-gradient(ellipse at 50% 120%,#3b2b5c 0,#141029 55%,#07080f 100%);border:1px solid var(--line);flex-wrap:wrap}
.ddens{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex:1}
.ddu{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:118px;position:relative;padding:8px 6px;border-radius:14px;border:2px solid transparent;transition:border-color .1s,background .1s}
.ddu b{font-size:13px}
.ddu .art{font-size:68px;line-height:1.05;filter:drop-shadow(0 8px 6px rgba(0,0,0,.7))}
.ddu.boss .art{font-size:96px}
.ddu.dead{opacity:.35}.ddu.dead .art{font-size:40px}
.ddu.tg{cursor:crosshair;border-color:rgba(255,93,143,.45)}.ddu.tg.hov,.ddu.tg:hover{border-color:var(--c);background:rgba(255,93,143,.12)}
.shk{animation:ddshk .3s}.lunge{animation:ddlunge .3s}
@keyframes ddshk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-4deg)}75%{transform:translateX(7px) rotate(4deg)}}
@keyframes ddlunge{50%{transform:translateX(-26px) scale(1.08)}}
.ddhp{position:relative;width:118px;height:16px;background:#3a0f1d;border-radius:8px;border:1px solid #000}
.ddhp span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b7f,#c22d4b);border-radius:8px;transition:width .3s}
.ddhp i{position:absolute;inset:0;text-align:center;font:800 11px/16px Inter,sans-serif;font-style:normal;text-shadow:0 1px 2px #000}
.ddblk{position:absolute;left:-16px;top:-7px;background:#2b5fa8;border:2px solid #8fc8ff;border-radius:8px;font:800 11px Inter,sans-serif;font-style:normal;padding:2px 4px;cursor:help}
.ddsts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.ddst{background:#0f1224;border:1px solid var(--line);border-radius:6px;padding:1px 4px;font-size:12px;font-weight:800;cursor:help}
.ddint{font:800 16px Inter,sans-serif;background:rgba(0,0,0,.45);border-radius:999px;padding:3px 10px;cursor:help;display:flex;gap:6px;animation:ddbob 1.4s ease-in-out infinite}
.ddint .ia-a{color:#ff8a8a}
@keyframes ddbob{50%{transform:translateY(-4px)}}
.ddctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ddorb{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f0a020 60%,#9a5a00);color:#2a1600;font:800 24px Inter,sans-serif;display:grid;place-items:center;box-shadow:0 0 20px rgba(255,184,74,.55);cursor:help;flex:none}
.ddhint{flex:1;text-align:center;color:var(--dim);font-size:13px}.dddim{color:var(--dim);font-size:13px}
.ddend{background:#7a2a3e;border-color:#c2486a;font-size:15px;padding:10px 18px}.ddend:hover:not(:disabled){background:#a0354f}
.ddhand{display:flex;justify-content:center;margin-top:16px;min-height:200px;padding:0 12px}
.ddhand .ddc{margin-left:min(4px, calc((100% - var(--n) * 120px) / max(var(--n) - 1, 1)))}
.ddhand .ddc:first-child{margin-left:0}
.ddc{width:120px;height:178px;border-radius:12px;padding:8px 7px 6px;position:relative;background:linear-gradient(160deg,#5c2735,#2a1119);border:2px solid #b84a63;
  display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 6px 12px rgba(0,0,0,.55);flex:none;transition:transform .12s,box-shadow .12s;color:#fff}
.ddc.s{background:linear-gradient(160deg,#21446e,#0f1f38);border-color:#4a8ad1}.ddc.p{background:linear-gradient(160deg,#5e4a12,#2b2106);border-color:#d6a630}
.ddc.x{background:linear-gradient(160deg,#3a3d4a,#1c1d24);border-color:#666}
.ddc.can{cursor:pointer}.ddc.can:hover{transform:translateY(-16px) scale(1.06);z-index:5;box-shadow:0 12px 22px rgba(0,0,0,.6)}
.ddc.sel{transform:translateY(-24px) scale(1.08);z-index:6;box-shadow:0 0 0 3px var(--a),0 12px 22px rgba(0,0,0,.6)}
.ddc.no{filter:saturate(.35) brightness(.65)}
.ddcost{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f0a020);color:#2a1600;font:800 16px Inter,sans-serif;display:grid;place-items:center;border:2px solid #2a1600}
.ddc b{font-size:13px;line-height:1.15;min-height:16px}.ddc.r2 b{color:#8fd8ff}.ddc.r3 b{color:#ffd23f}
.ddc .ia{font-size:38px;margin:4px 0 2px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.ddc small{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.6);text-transform:uppercase}
.ddc p{font-size:11px;line-height:1.3;margin:5px 0 0;color:#f1ecff}
.ddc em{font-style:normal;font-weight:800}.ddc em.up{color:#5ee07a}.ddc em.dn{color:#ff8a8a}
.ddc.sold{display:grid;place-items:center;opacity:.3;font-weight:800}
.ddpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.ddpanel h3{margin:0;font-size:22px}.ddpanel p{margin:0;max-width:560px;line-height:1.55}
.ddbig{font-size:72px;line-height:1}
.ddtrack{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ddtrack span{width:34px;height:34px;border-radius:50%;background:#0f1224;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--dim)}
.ddtrack span.done{opacity:.55}.ddtrack span.now{border-color:var(--a);box-shadow:0 0 12px rgba(255,210,63,.5)}
.dddoors{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.dddoor{width:180px;padding:18px 12px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(#20254a,#11142a);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;transition:transform .12s,border-color .12s}
.dddoor:hover{transform:translateY(-4px);border-color:var(--a)}.dddoor span{font-size:46px}.dddoor b{font-size:17px}.dddoor small{color:var(--dim)}
.dddoor.elite{border-color:#a04060}.dddoor.boss{border-color:#ffd23f;width:240px}.dddoor.boss span{font-size:64px}
.ddloot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800}
.ddloot .btn{border-radius:12px;max-width:260px;line-height:1.4}.ddloot small{color:var(--dim);font-weight:400}
.ddrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px 0}
.ddbuy{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--a)}

<body>
<header>
  <div><h1 id="logo" title="Home">NATE'S COOL THING 😎</h1><p class="tag" id="tag"></p></div>
  <label class="search"><span>🔎</span><input id="q" type="search" placeholder="Search games..." autocomplete="off"></label>
</header>
<main>
  <section id="home"><div class="bar2"><nav class="cats" id="cats"></nav><div class="seg"><button data-f="all">Everyone</button><button data-f="1">1 Player</button><button data-f="2">2 Players</button></div></div><div id="grid"></div></section>
  <section id="play">
    <div class="bar"><button class="btn" id="back">← All games</button><h2 id="gname"></h2><button class="btn" id="restart">↻ Restart</button></div>
    <div id="status"></div>
    <div id="stage"></div>
    <p class="help" id="help"></p>
  </section>
</main>
<footer>High scores are saved in this browser.</footer>
<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return +localStorage.getItem('ra_'+k)||0}catch(e){return 0}},set(k,v){try{localStorage.setItem('ra_'+k,v)}catch(e){}}};
const keys={};let cur=null,timers=[];
function every(fn,ms){const id=setInterval(fn,ms);timers.push(()=>clearInterval(id))}
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(()=>clearTimeout(id))}
function loop(fn){let id;const f=()=>{fn();id=requestAnimationFrame(f)};id=requestAnimationFrame(f);timers.push(()=>cancelAnimationFrame(id))}
function clearTimers(){timers.forEach(f=>f());timers=[]}
const say=t=>$('#status').textContent=t;
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;$('#stage').appendChild(c);return [c,c.getContext('2d')]}
function best(id,score){if(score>store.get(id)){store.set(id,score);return true}return false}
function bestLow(id,v){const b=store.get(id);if(!b||v<b){store.set(id,v);return true}return false}
function box(cls){const el=document.createElement('div');el.className=cls;$('#stage').appendChild(el);return el}

addEventListener('keydown',e=>{
  if(!cur||e.target.tagName=='INPUT')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(cur.key&&(!e.repeat||cur.rep))cur.key(e.code,e.repeat);
  keys[e.code]=true;
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const CE=(()=>{
  const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
  const D={N:[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],B:[[-1,-1],[-1,1],[1,-1],[1,1]],R:[[-1,0],[1,0],[0,-1],[0,1]]};D.Q=D.K=D.B.concat(D.R);
  const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
  const pseudo=(B,r,c,st)=>{const p=B[r][c],out=[],en=p.c=='w'?'b':'w';
    if(p.t=='P'){const d=p.c=='w'?-1:1,start=p.c=='w'?6:1;
      if(inb(r+d,c)&&!B[r+d][c]){out.push({r:r+d,c});if(r==start&&!B[r+2*d][c])out.push({r:r+2*d,c,dbl:1})}
      for(const dc of[-1,1]){const rr=r+d,cc=c+dc;if(!inb(rr,cc))continue;
        if(B[rr][cc]&&B[rr][cc].c==en)out.push({r:rr,c:cc});else if(st.ep&&st.ep[0]==rr&&st.ep[1]==cc)out.push({r:rr,c:cc,ep:1})}}
    else if(p.t=='N'||p.t=='K'){for(const[dr,dc]of D[p.t]){const rr=r+dr,cc=c+dc;if(inb(rr,cc)&&(!B[rr][cc]||B[rr][cc].c==en))out.push({r:rr,c:cc})}}
    else for(const[dr,dc]of D[p.t]){let rr=r+dr,cc=c+dc;while(inb(rr,cc)){if(B[rr][cc]){if(B[rr][cc].c==en)out.push({r:rr,c:cc});break}out.push({r:rr,c:cc});rr+=dr;cc+=dc}}
    return out};
  const attacked=(B,r,c,by)=>{for(let i=0;i<8;i++)for(let j=0;j<8;j++){const p=B[i][j];if(!p||p.c!=by)continue;
    if(p.t=='P'){if(i+(by=='w'?-1:1)==r&&Math.abs(j-c)==1)return true;continue}
    if(pseudo(B,i,j,{}).some(m=>m.r==r&&m.c==c))return true}return false};
  const apply=(B,st,fr,fc,m)=>{const N=B.map(r=>r.slice()),p=N[fr][fc],s={castle:{...st.castle},ep:null};
    N[m.r][m.c]=p;N[fr][fc]=null;if(m.ep)N[fr][m.c]=null;if(m.dbl)s.ep=[(fr+m.r)/2,fc];
    if(p.t=='P'&&(m.r==0||m.r==7))N[m.r][m.c]={t:'Q',c:p.c};
    if(m.castle){if(m.c==6){N[fr][5]=N[fr][7];N[fr][7]=null}else{N[fr][3]=N[fr][0];N[fr][0]=null}}
    if(p.t=='K')s.castle[p.c+'K']=s.castle[p.c+'Q']=false;
    const touch=(r,c)=>{if(r==7&&c==0)s.castle.wQ=false;if(r==7&&c==7)s.castle.wK=false;if(r==0&&c==0)s.castle.bQ=false;if(r==0&&c==7)s.castle.bK=false};
    touch(fr,fc);touch(m.r,m.c);return[N,s]};

  const segHit=(ax,ay,bx,by,r,vx0,vy0,boost)=>{const dx=bx-ax,dy=by-ay;let t=((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));

const diveAns=s=>{const m=new Map();s.split(';').forEach(part=>{const[t,list]=part.split(':');list.split(',').forEach(a=>{const names=a.split('|');names.forEach(n=>m.set(diveNorm(n),{t,show:names[0]}))})});return m};
function diveNorm(s){return s.toLowerCase().replace(/^\s*(the|a|an)\s+/,'').replace(/[^a-z]/g,'')}
function diveFind(m,v){const n=diveNorm(v);if(!n)return null;for(const k of[n,n.replace(/s$/,''),n.replace(/es$/,''),n.replace(/ies$/,'y')])if(m.has(k))return m.get(k);return null}

/* ---------- NIGHT SHIFT shared engine: sound, monster art, night menu, clock, jump scares ---------- */
const NS=(()=>{
  let ac=null;
  const A=()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}catch(e){ac=null}return ac};
  const out=(a,pan)=>{if(pan==null||!a.createStereoPanner)return a.destination;const p=a.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));p.connect(a.destination);return p};
  const env=(g,a,vol,dur,att=.005)=>{const t=a.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur)};
  const noise=(dur,vol,freq=1000,type='bandpass',q=1,pan)=>{const a=A();if(!a)return;const n=Math.max(1,a.sampleRate*dur|0),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();env(g,a,vol,dur);s.connect(f);f.connect(g);g.connect(out(a,pan));s.start()};
  const tone=(fr,dur,vol,type='sine',to,pan,att)=>{const a=A();if(!a)return;const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+dur);
    const g=a.createGain();env(g,a,vol,dur,att);o.connect(g);g.connect(out(a,pan));o.start();o.stop(a.currentTime+dur+.05)};
  const S={
    step:(v=.35,pan)=>{tone(70,.18,v,'sine',40,pan);noise(.1,v*.4,250,'lowpass',1,pan)},
    door:()=>{noise(.35,.6,220,'lowpass');tone(55,.3,.4,'square',35)},
    click:()=>tone(1800,.03,.07,'square'),
    cam:()=>noise(.16,.1,3500,'highpass'),
    knock:(pan)=>{noise(.07,.55,180,'lowpass',1,pan);later(()=>noise(.07,.55,180,'lowpass',1,pan),170);later(()=>noise(.07,.55,180,'lowpass',1,pan),340)},
    breath:(pan)=>noise(1.2,.22,450,'lowpass',1,pan),
    giggle:(pan)=>{for(let i=0;i<4;i++)later(()=>tone(650+Math.random()*350,.09,.1,'triangle',480,pan),i*120)},
    clang:(pan)=>{tone(220,.7,.22,'triangle',205,pan);tone(331,.5,.14,'triangle',null,pan)},
    scream:()=>{for(let i=0;i<6;i++)tone(250+Math.random()*900,1.4,.22,'sawtooth',90+Math.random()*200);noise(1.4,1,1400,'bandpass',.4)},
    chime:()=>[523,659,784,1046,784,1046].forEach((f,i)=>later(()=>tone(f,1.3,.22,'sine'),i*330)),
    alarm:()=>{tone(880,.22,.13,'square');later(()=>tone(620,.22,.13,'square'),250)},
    thump:(pan)=>tone(48,.45,.7,'sine',30,pan),
    scratch:(pan)=>noise(.4,.3,2400,'bandpass',3,pan),
    splash:(pan)=>noise(.6,.3,700,'lowpass',1,pan),
    caw:(pan)=>tone(900,.3,.14,'sawtooth',500,pan),
    whistle:()=>{tone(740,1.1,.18,'square',null,null,.08);tone(988,1.1,.12,'square',null,null,.08)},
    ping:()=>{tone(1320,1.2,.16,'sine',1250);later(()=>tone(1320,.8,.06,'sine'),400)},
    beep:()=>tone(1000,.07,.07,'square'),
    wind:()=>noise(2.4,.12,500,'bandpass',.6,Math.random()*2-1),
    music:()=>{const m=[392,440,392,349,330,349,392,0,330,349,330,294,262];m.forEach((f,i)=>f&&later(()=>tone(f,.35,.09,'triangle'),i*380))},
    powerdown:()=>tone(300,2.2,.2,'sawtooth',30)};
  const drone=(f1=46,f2=48.7,vol=.045,cut=220)=>{const a=A();if(!a)return()=>{};const g=a.createGain();g.gain.value=vol;g.connect(a.destination);
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;lp.connect(g);
    const os=[f1,f2].map(f=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();return o});
    let done=false;const stop=()=>{if(done)return;done=true;try{g.gain.setTargetAtTime(.0001,a.currentTime,.1);os.forEach(o=>o.stop(a.currentTime+.4))}catch(e){}};timers.push(stop);return stop};
  /* ===== original monster art (all drawn with canvas) ===== */

              const shake=stairs==5?(Math.random()-.5)*6:0;x.fillStyle='#3a2c1e';x.fillRect(HATCH[0]+shake,HATCH[1],HATCH[2],HATCH[3]);x.strokeStyle='#1f160e';x.lineWidth=6;x.strokeRect(HATCH[0]+shake,HATCH[1],HATCH[2],HATCH[3]);

/* ---------- NIGHT SHIFT 3: POLAR OUTPOST ---------- */
{id:'ns3',name:'Night Shift: Polar Outpost',icon:'🧊',p:1,unit:' nights',desc:'Horror survival. Something got into a snowed-in research base and it is hunting you. Track it, trick it and keep warm until dawn.',help:'Click a door on the map (or press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>) to seal it · <kbd>Space</kbd> sonar ping · click a room then <kbd>L</kbd> to play a lure sound there · <kbd>H</kbd> heater<br>The tracker only beeps when something MOVES. Sonar shows it exactly, but it hears you. Turn your sound on!',
start(){
  const g=this,{S}=NS;
  const RM={0:['CONTROL',250,380,120,80],1:['LAB',250,250,120,70],2:['STORAGE',90,250,130,70],3:['GENERATOR',90,350,130,70],4:['DORMS',400,250,130,70],5:['KITCHEN',400,350,130,70],6:['GARAGE',90,150,130,70],7:['COMMS',400,150,130,70],8:['AIRLOCK',250,70,120,60]};
  const ED=[[8,6],[8,7],[6,2],[7,4],[2,3],[4,5],[2,1],[4,1],[1,0],[3,0],[5,0]];
  const DOORS={1:{r:1,n:'NORTH',k:1},3:{r:3,n:'WEST',k:2},5:{r:5,n:'EAST',k:3}};
  const nb=r=>ED.filter(e=>e.includes(r)).map(e=>e[0]==r?e[1]:e[0]);
  const path=(a,b)=>{const prev={[a]:null},q=[a];while(q.length){const c=q.shift();if(c==b)break;for(const nx of nb(c))if(!(nx in prev)){prev[nx]=c;q.push(nx)}}const p=[];let c=b;while(c!=null&&c!=a){p.unshift(c);c=prev[c]}return p};
  const cen=r=>[30+RM[r][1]+RM[r][3]/2,30+RM[r][2]+RM[r][4]/2];
  const AI=[[4,0,1],[7,0,2],[10,0,3],[12,5,4],[15,8,5],[19,13,6]];
  NS.run(g,{id:'ns3',title:'POLAR OUTPOST',col:'#7fd3ff',art:'mimic',
    blurb:['Outpost Frostbite. The rest of the crew left in the last plane.','You stayed behind to watch the base for one week.','Last night, the motion tracker started beeping.'],
    tips:[['The tracker beeps when something moves. Watch it come closer.','When it reaches a room next to CONTROL, seal that door!'],
      ['It is getting colder. Turn on the heater (H) when it drops below zero,','but the heater is LOUD. It can hear it.'],
      ['Use the LURE: click a far away room, press L, and it will go check the noise.','It can copy sounds now. Some beeps might be fake...'],

    make(n,api){

      const seal={1:false,3:false,5:false},integ={1:1,3:1,5:1},broken={1:0,3:0,5:0};

      const blip=(r,fake)=>{const[cx,cy]=cen(r);blips.push({x:cx+(Math.random()-.5)*RM[r][3]*.7,y:cy+(Math.random()-.5)*RM[r][4]*.6,t:api.t});S.beep();if(!fake&&Math.random()<.3)log('Motion: '+RM[r][0])};
      const sealed=d=>seal[d]&&broken[d]<=0&&fuel>0;
      const toggleDoor=d=>{if(broken[d]>0){api.say('That door is broken!');return}if(!seal[d]&&Object.values(seal).filter(Boolean).length>=2){api.say('You can only seal 2 doors at once.');return}seal[d]=!seal[d];S.door()};
      const sonar=()=>{if(sonarCd>0||fuel<=0)return;sonarCd=9;sonarShow=2.6;fuel-=2;S.ping();hunters.forEach(h=>{h.tm=Math.min(h.tm,1.2);h.target=0})};
      const lure=()=>{if(lureCd>0||pick<0||pick==0)return;lureCd=14;lureRoom=pick;lureT=12;S.giggle();log('Lure playing in '+RM[pick][0]);hunters.forEach(h=>{if(h.k=='mimic'||Math.random()<.6)h.target=pick})};
      const step=h=>{const goal=lureT>0&&h.target==lureRoom?lureRoom:heat&&Math.random()<.7?0:h.target;
        if(h.r==goal){if(goal!=0){h.target=0}return}
        const p=path(h.r,goal);if(!p.length)return;const nx=p[0];
        if(nx==0){if(!h.poised){h.poised=2.6;S.breath();}return}
        h.r=nx;if(h.k=='mimic')blip(nx);const[cx]=cen(nx);if(DOORS[nx])S.step(.4,(cx-340)/300);else if(h.k=='mimic')S.step(.12,(cx-340)/300)};
      const DR=r=>{const[cx,cy]=cen(r),[ox,oy]=cen(0);return[(cx+ox)/2-20,(cy+oy)/2-12,40,24]};
      const BTN={sonar:[640,250,290,44],lure:[640,306,290,44],heat:[640,362,290,44]};
      return{
        update(dt){const h=api.hour();if(h!=hr){hr=h;if(h==2||h==4)hunters.forEach(x=>x.a++)}
          sonarCd=Math.max(0,sonarCd-dt);lureCd=Math.max(0,lureCd-dt);sonarShow=Math.max(0,sonarShow-dt);if(lureT>0)lureT-=dt;
          windT-=dt;if(windT<=0){windT=5+Math.random()*6;S.wind()}
          temp-=dt*(.16+ai[2]*.05);if(heat&&fuel>0){temp+=dt*1.15;fuel-=dt*.2}temp=Math.min(22,temp);
          for(const d in seal)if(sealed(d))fuel-=dt*.09;for(const d in broken)if(broken[d]>0){broken[d]-=dt;if(broken[d]<=0){integ[d]=.6;log('The '+DOORS[d].n+' door is fixed.')}}
          if(fuel<=0&&!this.out){this.out=1;fuel=0;heat=false;S.powerdown();api.say('The generator is out of fuel!',5)}
          if(temp<=-15)api.lose('mimic','You froze solid. It found you in the morning.');
          if(n>=3&&Math.random()<dt*.05){blip(1+Math.floor(Math.random()*8),true)}
          for(const hh of hunters){
            if(hh.poised>0){hh.poised-=dt;if(hh.poised<=0){const d=hh.r;if(!sealed(d)){api.lose(hh.k,(hh.k=='mimic'?'The Mimic':'The Hollow')+' came in through the '+DOORS[d].n+' door.');return}hh.scr=6}continue}
            if(hh.scr>0){hh.scr-=dt;const d=hh.r;if(Math.random()<dt*2.5)S.scratch((cen(d)[0]-340)/300);integ[d]-=dt*(.05+hh.a*.004);
              if(integ[d]<=0){integ[d]=0;broken[d]=15;seal[d]=false;S.clang();log('The '+DOORS[d].n+' door was torn open!');hh.scr=0;hh.poised=1.2;continue}
              if(!sealed(d)){hh.scr=0;hh.poised=.8;continue}
              if(hh.scr<=0){hh.target=[6,7,8][Math.random()*3|0];log('Scratching stopped...')}continue}
            hh.tm-=dt*(heat?1.6:1);if(hh.tm<=0){hh.tm=Math.max(2.4,9-hh.a*.33)*(hh.k=='hollow'?1.4:1)*(.75+Math.random()*.5);if(Math.random()<.35+hh.a/24)step(hh);if(hh.target!=0&&hh.r==hh.target&&!(lureT>0))hh.target=0}}
          blips=blips.filter(b=>api.t-b.t<1.6)},
        draw(x,now){const W=960,H=540,col=fuel>0?'#3ee0a0':'#335';
          x.fillStyle='#030806';x.fillRect(0,0,W,H);
          x.strokeStyle=fuel>0?'#0f3a26':'#111';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
          x.strokeStyle=col;x.lineWidth=3;ED.forEach(([a,b])=>{const p=cen(a),q=cen(b);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke()});
          for(const r in RM){const[nm,rx,ry,rw,rh]=RM[r];x.fillStyle=+r==0?'#0e2a1e':+r==pick?'#163a2a':'#061510';x.fillRect(30+rx,30+ry,rw,rh);x.strokeStyle=+r==lureRoom&&lureT>0?'#ffd23f':col;x.lineWidth=2;x.strokeRect(30+rx,30+ry,rw,rh);
            NS.txt(x,nm,30+rx+rw/2,30+ry+14,8,col);if(+r==lureRoom&&lureT>0)NS.txt(x,'♪ LURE',30+rx+rw/2,30+ry+rh-14,8,'#ffd23f')}
          NS.txt(x,'YOU',cen(0)[0],cen(0)[1]+10,10,'#e8e0d0');
          for(const d in DOORS){const r=DR(+d),s=sealed(d),b=broken[d]>0;x.fillStyle=b?'#5a1020':s?'#3ee0cf':'#0a1a14';x.fillRect(...r);x.strokeStyle=b?'#ff5d8f':'#e8e0d0';x.strokeRect(...r);
            NS.txt(x,b?'XX':s?'▮▮':DOORS[d].k,r[0]+20,r[1]+13,9,s?'#111':'#e8e0d0');x.fillStyle='#222';x.fillRect(r[0],r[1]+28,40,4);x.fillStyle=integ[d]<.35?'#ff5d8f':'#3ee0cf';x.fillRect(r[0],r[1]+28,40*integ[d],4)}
          const sw=(now*2)%1;const[ox,oy]=cen(0);x.strokeStyle='rgba(62,224,160,'+(1-sw)*.5+')';x.lineWidth=2;x.beginPath();x.arc(ox,oy,sw*420,0,7);x.stroke();
          blips.forEach(b=>{const a=1-(api.t-b.t)/1.6;x.fillStyle='rgba(255,80,80,'+a+')';x.beginPath();x.arc(b.x,b.y,9,0,7);x.fill()});
          if(sonarShow>0)hunters.forEach(h=>{const[cx,cy]=cen(h.r);NS.draw(x,h.k,cx,cy+8,.16,now,null,Math.min(1,sonarShow));NS.txt(x,h.k=='mimic'?'MIMIC':'HOLLOW',cx,cy-28,7,'#ff5d8f')});
          /* side panel */
          x.fillStyle='rgba(6,20,14,.9)';x.fillRect(620,40,320,470);x.strokeStyle=col;x.strokeRect(620,40,320,470);
          NS.txt(x,'OUTPOST FROSTBITE',780,62,10,col);
          NS.txt(x,'TEMP '+temp.toFixed(1)+'°C',640,96,12,temp<0?'#7fd3ff':'#e8e0d0','left');x.fillStyle='#111';x.fillRect(640,110,290,12);x.fillStyle=temp<0?'#7fd3ff':'#ff8a3d';x.fillRect(640,110,290*Math.max(0,(temp+15)/37),12);

          NS.txt(x,'Click a door on the map to seal it',640,200,7,'#8a90b8','left');NS.txt(x,'(max 2 sealed · sealed doors use fuel)',640,218,7,'#8a90b8','left');

/* ---------- NIGHT SHIFT 4: GHOST TRAIN ---------- */
{id:'ns4',name:'Night Shift: Ghost Train',icon:'🚂',p:1,unit:' nights',desc:'Horror survival. Guard the last car of a midnight train. Keep the engine hot, watch the roof and never shine your lantern in the Conductor\'s face.',help:'<kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> turn · <kbd>C</kbd> shovel coal · <kbd>W</kbd> pull the whistle · hold <kbd>Space</kbd> lantern · hold <kbd>F</kbd> hold the door<br>You can click the furnace, cord and door too. Use headphones: the roof footsteps move left and right! Turn your sound on!',
start(){
  const g=this,{S}=NS;
  const AI=[[4,3,0,0],[6,5,3,1],[8,7,6,2],[11,10,9,3],[14,13,12,4],[18,17,16,5]];
  NS.run(g,{id:'ns4',title:'GHOST TRAIN',col:'#ff8a3d',art:'conductor',
    blurb:['The 12:00 Midnight Express runs every night with no passengers.','You ride in the caboose and keep it moving until sunrise.','Whatever you do, do not let the train stop.'],
    tips:[['Strawmen chase the train in the fields. Shovel coal (C) to keep the speed up.','The Conductor walks toward you through the cars. Shine your lantern (SPACE) to send him back.'],
      ['When the Conductor reaches your door, DON\'T shine the lantern. Hold the door (F)!','Something walks on the roof now. When it stops over the hatch, pull the whistle (W).'],
      ['The footsteps move left and right. Listen closely.'],['The coal burns faster now.'],['Last stop. Hold on tight.'],['Night 6. The train will not stop for anyone.']],
    make(n,api){
      const ai=AI[n-1].slice();let view=1,vx=960,P=80,shovelCd=0,shov=0,dist=1,car=5,carTm=7,shineT=0,oil=100,doorT=0,doorHold=0,roof=ai[2]?(Math.random()<.5?-4:4):99,roofTm=8,hatchT=0,whist=0,hr=0,scroll=0,mouseHeld=null,cord=0;
      api.drone(55,57.5,.04,300);let clack=0;
      const lantern=()=>view==2&&oil>0&&(keys.Space||mouseHeld=='door2');
      const holdDoor=()=>view==2&&(keys.KeyF||mouseHeld=='door');
      const turn=d=>{const v=Math.max(0,Math.min(2,view+d));if(v!=view){view=v;S.step(.06)}};
      const shovel=()=>{if(view!=1||shovelCd>0)return;shovelCd=.28;shov=1;P=Math.min(100,P+6.5);S.scratch(-.6);};
      const whistle=()=>{if(view!=1||whist>0)return;whist=1.3;cord=1;P=Math.max(0,P-14);S.whistle();if(roof==0){roof=Math.random()<.5?-4:4;hatchT=0;later(()=>S.thump(roof<0?-.9:.9),500);api.say('The whistle shook it off the roof!')}};
      const ARW=[[14,230,50,80],[896,230,50,80]],FURN=[80,250,220,220],CORD=[740,120,80,300],DOOR=[330,60,300,420];
      return{
        update(dt){const h=api.hour();if(h!=hr){hr=h;if(h==2||h==4)ai.forEach((a,i)=>{if(a&&i<3)ai[i]++})}
          vx+=(view*960-vx)*Math.min(1,dt*9);shovelCd-=dt;shov=Math.max(0,shov-dt*4);whist=Math.max(0,whist-dt);cord=Math.max(0,cord-dt*2);
          P-=dt*(1.05+ai[3]*.17);P=Math.max(0,P);scroll+=dt*P*.06;clack-=dt*P/40;if(clack<=0){clack=1;S.step(.05)}
          /* strawmen */
          if(ai[0]){dist+=dt*(P/100*1.25-1)*ai[0]*.0042;dist=Math.min(1,dist);if(dist<.25&&Math.random()<dt*.6)S.breath(0);if(dist<=0)api.lose('scarecrow','The train went too slow. The Strawmen caught the caboose.')}
          /* conductor */
          if(ai[1]){if(lantern()){oil=Math.max(0,oil-dt*13);if(car==0){api.lose('conductor','You shined your lantern in the Conductor\'s face.');return}shineT+=dt;if(shineT>1.1&&car<5){car++;shineT=0;S.step(.12);api.say('The Conductor stepped back a car.')}}else{shineT=0;oil=Math.min(100,oil+dt*4)}
            if(car>0){carTm-=dt;if(carTm<=0){carTm=7.5-ai[1]*.15;if(Math.random()*20<ai[1]){car--;S.step(.1+(5-car)*.07);if(car==0){doorT=0;doorHold=0;S.knock()}}}}
            else{doorT+=dt;if(holdDoor()){doorHold+=dt;if(Math.random()<dt*3)S.thump();if(doorHold>3){car=3;carTm=7;api.say('The Conductor gave up and walked away.')}}else if(doorT>5)api.lose('conductor','The Conductor opened the door.');if(Math.random()<dt*.8)S.knock()}}
          /* the hollow on the roof */
          if(ai[2]){if(roof!=0){roofTm-=dt;if(roofTm<=0){roofTm=6.5-ai[2]*.12;if(Math.random()*20<ai[2]){roof+=roof<0?1:-1;const pan=roof/4;S.step(.18+(4-Math.abs(roof))*.08,pan);later(()=>S.step(.18,pan),350);if(roof==0){hatchT=0;S.thump()}}}}
            else{hatchT+=dt;if(Math.random()<dt*1.5)S.thump();if(hatchT>4.5)api.lose('hollow','The Hollow tore open the roof hatch.')}}},
        draw(x,now){const W=960,H=540;x.fillStyle='#0a0807';x.fillRect(0,0,W,H);const sway=Math.sin(now*3)*2*P/100;
          for(let p=0;p<3;p++){const ox=p*960-vx;if(ox<-960||ox>960)continue;x.save();x.translate(ox,sway);
            x.fillStyle='#24170f';x.fillRect(0,0,W,H);x.fillStyle='#2e1e14';for(let k=0;k<12;k++)x.fillRect(k*82,0,4,H);x.fillStyle='#1a100a';x.fillRect(0,470,W,70);

{id:'2048',name:'2048',icon:'🔢',p:1,desc:'Slide and merge matching tiles to reach 2048.',help:'<kbd>Arrows</kbd> or <kbd>WASD</kbd> to slide the tiles',
start(){
  const el=box('g2048');
  let b=Array(16).fill(0),score=0,over=false;
  const colors={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  const add=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};
  const draw=()=>{el.innerHTML=b.map(v=>`<div style="background:${v?(colors[v]||'#3c3a32'):'#2a3058'};color:${v>4?'#fff':'#5a4f45'}">${v||''}</div>`).join('');
    say('Score '+score+' · Best '+Math.max(score,store.get('2048'))+(over?' · No moves left!':''))};
  const slide=row=>{const r=row.filter(v=>v);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;score+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r};
  const idx=(d,l,k)=>d=='L'?l*4+k:d=='R'?l*4+3-k:d=='U'?k*4+l:(3-k)*4+l;
  const canMove=()=>{if(b.includes(0))return true;for(let i=0;i<16;i++){if(i%4<3&&b[i]==b[i+1])return true;if(i<12&&b[i]==b[i+4])return true}return false};
  const move=d=>{if(over)return;const old=b.join(),nb=b.slice();
    for(let l=0;l<4;l++){const r=slide([0,1,2,3].map(k=>b[idx(d,l,k)]));r.forEach((v,k)=>nb[idx(d,l,k)]=v)}
    b=nb;if(b.join()!=old){add();best('2048',score);if(!canMove())over=true;draw()}};
  const map={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D'};
  this.key=k=>map[k]&&move(map[k]);
  add();add();draw();
}},
/* ---------- MINESWEEPER ---------- */
{id:'mines',name:'Minesweeper',icon:'💣',p:1,unit:'s',desc:'Clear the field without hitting a mine. Numbers count nearby mines.',help:'Click to dig · Right-click (two-finger tap) or <kbd>Shift</kbd>+click to place a flag',
start(){
  const N=10,M=15;const el=box('mine');
  const mine=Array(N*N).fill(false),rev=Array(N*N).fill(false),flag=Array(N*N).fill(false),cells=[];
  let first=true,over=false,t0=0,left=N*N-M;
  const nb=i=>{const r=i/N|0,c=i%N,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)o.push(rr*N+cc)}return o};
  const plant=safe=>{const ban=new Set([safe,...nb(safe)]);let k=0;while(k<M){const i=Math.random()*N*N|0;if(!mine[i]&&!ban.has(i)){mine[i]=true;k++}}};
  const count=i=>nb(i).filter(j=>mine[j]).length;
  const colors=['','#7b8cff','#3ee0cf','#ff5d8f','#c58bff','#ffb03f','#3ee0cf','#fff','#aaa'];
  const show=i=>{if(rev[i]||flag[i])return;rev[i]=true;left--;const b=cells[i];b.classList.add('open');const n=count(i);if(n){b.textContent=n;b.style.color=colors[n]}else nb(i).forEach(show)};
  const hud=()=>{if(!over)say('Mines '+(M-flag.filter(Boolean).length)+' · Time '+(first?0:Math.floor((Date.now()-t0)/1000))+'s'+(store.get('mines')?' · Best '+store.get('mines')+'s':''))};
  const click=(i,f)=>{
    if(over||rev[i])return;
    if(f){flag[i]=!flag[i];cells[i].textContent=flag[i]?'🚩':'';hud();return}
    if(flag[i])return;
    if(first){first=false;plant(i);t0=Date.now()}
    if(mine[i]){over=true;mine.forEach((m,j)=>{if(m){cells[j].textContent='💣';cells[j].classList.add('open')}});cells[i].style.background='#7a1f3d';say('Boom! Hit Restart to try again');return}
    show(i);
    if(left==0){over=true;const s=Math.max(1,Math.floor((Date.now()-t0)/1000));say((bestLow('mines',s)?'NEW BEST! ':'')+'Field cleared in '+s+'s!')}
    else hud();
  };
  for(let i=0;i<N*N;i++){const b=document.createElement('button');b.onclick=e=>click(i,e.shiftKey);b.oncontextmenu=e=>{e.preventDefault();click(i,true)};cells.push(b);el.appendChild(b)}
  every(hud,1000);hud();
}},

{id:'blocks',name:'Block Drop',icon:'🟦',p:1,rep:true,desc:'Stack the falling blocks and clear full rows.',help:'<kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd> rotate · <kbd>↓</kbd> drop faster · <kbd>Space</kbd> slam down',

/* ---------- TOWER DEFENSE ---------- */
{id:'td',name:'Tower Defense',icon:'🏰',p:1,unit:' waves',desc:'Build and upgrade towers to stop wave after wave of invaders. Bosses every 5th wave.',help:'Pick a tower, then click the grass to build it · click a tower to upgrade it (up to level 3)<br><kbd>1</kbd>–<kbd>3</kbd> pick a tower · <kbd>Space</kbd> sends the next wave',
start(){

  const bar=document.createElement('div');bar.className='tdbar';wrap.appendChild(bar);

  for(let k=0;k<WP.length-1;k++){let[a,b]=WP[k];const[c2,d]=WP[k+1];while(a!=c2||b!=d){if(a>=0&&a<GW)pathSet.add(b*GW+a);a+=Math.sign(c2-a);b+=Math.sign(d-b)}if(c2>=0&&c2<GW)pathSet.add(d*GW+c2)}

  const spawn=()=>{const boss=wave%5==0&&spawnLeft==1;const hp=Math.round(22*Math.pow(1.27,wave-1)*(boss?8:1));
    foes.push({x:PTS[0][0],y:PTS[0][1],seg:0,hp,max:hp,sp:(boss?.55:.85)+wave*.03,slow:0,boss,prog:0})};
  const hurt=(f,d)=>{f.hp-=d;if(f.hp<=0&&!f.dead){f.dead=1;gold+=f.boss?40+wave*4:4+(wave/2|0);dirty=true}};
  reset();

      if(active&&spawnLeft>0&&--spawnT<=0){spawn();spawnLeft--;spawnT=36}

        while(sp>0&&f.seg<PTS.length-1){const[tx,ty]=PTS[f.seg+1];const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);if(d<=sp){f.x=tx;f.y=ty;f.seg++;sp-=d}else{f.x+=dx/d*sp;f.y+=dy/d*sp;sp=0}}
        const nx=PTS[Math.min(f.seg+1,PTS.length-1)];f.prog=f.seg*1e4-Math.hypot(nx[0]-f.x,nx[1]-f.y);

        let tg=null;for(const f of foes)if(!f.dead&&Math.hypot(f.x-t.x,f.y-t.y)<=s.range&&(!tg||f.prog>tg.prog))tg=f;
        if(!tg)continue;t.cd=s.rate;t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);
        if(T.splash){const R=T.splash*CS;const tx=tg.x,ty=tg.y;foes.forEach(f=>{if(!f.dead&&Math.hypot(f.x-tx,f.y-ty)<=R)hurt(f,s.dmg)});fx.push({k:'boom',x:tx,y:ty,r:R,t:14})}

      if(dirty){dirty=false;hud()}
    }
    fx.forEach(e=>e.t--);fx=fx.filter(e=>e.t>0);
    x.fillStyle='#14231b';x.fillRect(0,0,W,H);
    for(let i=0;i<GW*GH;i++){const gx=(i%GW)*CS,gy=(i/GW|0)*CS;
      if(pathSet.has(i)){x.fillStyle='#4a3a28';x.fillRect(gx,gy,CS,CS)}else if((i%GW+(i/GW|0))%2){x.fillStyle='#172a20';x.fillRect(gx,gy,CS,CS)}}
    x.font='26px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🏰',W-CS/2+4,8*CS+CS/2);
    if(hov>=0&&!pathSet.has(hov)&&!over){const t=towers.find(t=>t.i==hov),hx=(hov%GW)*CS+CS/2,hy=(hov/GW|0)*CS+CS/2;
      const R=t?stat(t).range:TYPES[sel].range*CS;x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.beginPath();x.arc(hx,hy,R,0,7);x.stroke();
      x.fillStyle='rgba(255,255,255,.12)';x.fillRect(hx-CS/2,hy-CS/2,CS,CS);
      if(t){x.fillStyle='#fff';x.font='bold 11px Inter,sans-serif';x.fillText(t.lv<3?'Upgrade '+upCost(t)+'g':'MAX',hx,hy-CS/2-8)}}
    towers.forEach(t=>{const T=TYPES[t.t];x.fillStyle='#2a3058';x.fillRect(t.x-15,t.y-15,30,30);
      x.fillStyle=T.col;x.beginPath();x.arc(t.x,t.y,10,0,7);x.fill();
      x.strokeStyle=T.col;x.lineWidth=t.t==2?7:4;x.beginPath();x.moveTo(t.x,t.y);x.lineTo(t.x+Math.cos(t.ang)*17,t.y+Math.sin(t.ang)*17);x.stroke();
      x.fillStyle='#ffd23f';for(let l=0;l<t.lv;l++)x.fillRect(t.x-13+l*7,t.y+10,5,4)});
    foes.forEach(f=>{const r=f.boss?15:9;x.fillStyle=f.slow>0?'#9be7ff':f.boss?'#c58bff':'#ff5d8f';x.beginPath();x.arc(f.x,f.y,r,0,7);x.fill();
      x.fillStyle='#111';x.fillRect(f.x-r,f.y-r-7,r*2,4);x.fillStyle='#5ee07a';x.fillRect(f.x-r,f.y-r-7,r*2*Math.max(0,f.hp/f.max),4)});
    fx.forEach(e=>{if(e.k=='beam'){x.strokeStyle=e.col;x.globalAlpha=e.t/6;x.lineWidth=3;x.beginPath();x.moveTo(e.x1,e.y1);x.lineTo(e.x2,e.y2);x.stroke()}
      else{x.strokeStyle='#ffb03f';x.globalAlpha=e.t/14;x.lineWidth=4;x.beginPath();x.arc(e.x,e.y,e.r*(1-e.t/20),0,7);x.stroke()}x.globalAlpha=1});
    if(over){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);x.fillStyle='#ffd23f';x.font='18px "Press Start 2P",monospace';x.fillText('GAME OVER',W/2,H/2)}
  });

{id:'muncher',name:'Maze Muncher',icon:'👻',p:1,desc:'Gobble every dot and dodge four ghosts. Grab a power pellet to turn the tables.',help:'<kbd>Arrows</kbd> or <kbd>WASD</kbd> to move · the side tunnels wrap around',
start(){
  const MAP=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.### # ###.####","   #.#       #.#   ","####.# ##-## #.####","    .  #   #  .    ","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o.#.....P.....#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#","#.................#","###################"];
  const R=MAP.length,C=MAP[0].length,U=40,CS=22,k=CS/U;const [cv,x]=canvas(C*CS,R*CS);
  const GC=['#ff4d4d','#ffb8ff','#4dfcff','#ffb852'],CORNER=[[C-2,0],[1,0],[C-2,R-1],[1,R-1]],DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
  let grid,dots,pac,want,ghosts,score,lives,level,fr=0,mode,modeT,frightT,chain,started,over,freeze=0,onThaw=null,pops=[];
  const wall=(cx,cy)=>{if(cy<0||cy>=R)return true;cx=(cx+C)%C;const ch=grid[cy][cx];return ch=='#'||ch=='-'};
  const loadMaze=()=>{grid=MAP.map(r=>[...r].map(ch=>ch=='P'?' ':ch));dots=0;grid.forEach(r=>r.forEach(ch=>{if(ch=='.'||ch=='o')dots++}))};
  const place=()=>{pac={x:9*U,y:15*U,d:[0,0]};want=[0,0];
    ghosts=GC.map((col,i)=>({col,i,x:(i==0?9:7+i)*U,y:(i==0?7:9)*U,d:[-1,0],m:i==0?'out':'house',t:i*180}));
    mode='scatter';modeT=420;frightT=0;chain=0};
  const hud=()=>say(over||'Score '+score+' · Lives '+'♥'.repeat(lives)+' · Level '+level+' · Best '+Math.max(score,store.get('muncher'))+(started?'':' · press an arrow key to start'));
  const reset=()=>{score=0;lives=3;level=1;over='';started=false;freeze=0;loadMaze();place();hud()};
  const map={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
  this.key=k=>{if(over){if(k=='Space')reset();return}const m=map[k];if(m){want=m;if(!started){started=true;hud()}}};
  const wrapX=e=>{if(e.x<0)e.x+=C*U;if(e.x>=C*U)e.x-=C*U};
  const target=g=>{if(mode=='scatter')return CORNER[g.i];
    const px=Math.round(pac.x/U),py=Math.round(pac.y/U),[dx,dy]=pac.d;
    if(g.i==0)return[px,py];if(g.i==1)return[px+4*dx,py+4*dy];
    if(g.i==2){const r=ghosts[0];return[2*(px+2*dx)-Math.round(r.x/U),2*(py+2*dy)-Math.round(r.y/U)]}
    return Math.hypot(Math.round(g.x/U)-px,Math.round(g.y/U)-py)>7?[px,py]:CORNER[3]};
  const moveG=g=>{
    if(g.m=='house'){if(--g.t<=0){g.m='out';g.x=9*U;g.y=7*U;g.d=[-1,0]}return}
    const sp=g.m=='fright'||g.x%4||g.y%4?2:4;
    if(g.x%U==0&&g.y%U==0){const cx=g.x/U,cy=g.y/U;
      let opts=DIRS.filter(d=>!(d[0]==-g.d[0]&&d[1]==-g.d[1])&&!wall(cx+d[0],cy+d[1]));if(!opts.length)opts=[[-g.d[0],-g.d[1]]];
      if(g.m=='fright')g.d=opts[Math.random()*opts.length|0];
      else{const[tx,ty]=target(g);opts.sort((a,b)=>Math.hypot(cx+a[0]-tx,cy+a[1]-ty)-Math.hypot(cx+b[0]-tx,cy+b[1]-ty));g.d=opts[0]}}
    g.x+=g.d[0]*sp;g.y+=g.d[1]*sp;wrapX(g)};
  const movePac=()=>{
    if((want[0]||want[1])&&want[0]==-pac.d[0]&&want[1]==-pac.d[1])pac.d=want;
    if(pac.x%U==0&&pac.y%U==0){const cx=pac.x/U,cy=pac.y/U,ch=grid[cy][cx];
      if(ch=='.'){grid[cy][cx]=' ';score+=10;dots--;hud()}

        ghosts.forEach(g=>{if(g.m=='out'||g.m=='fright'){g.m='fright';g.d=[-g.d[0],-g.d[1]]}});hud()}
      if((want[0]||want[1])&&!wall(cx+want[0],cy+want[1]))pac.d=want;
      if(wall(cx+pac.d[0],cy+pac.d[1]))pac.d=[0,0]}

  const collide=()=>{for(const g of ghosts){if(g.m=='house')continue;const dx=Math.abs(g.x-pac.x),dxw=Math.min(dx,C*U-dx);

      else{lives--;freeze=80;
        if(lives<=0){over='Game over · Score '+score+' · Space to play again';best('muncher',score)}else onThaw=place;

    x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);
    x.strokeStyle='#3b5bff';x.fillStyle='#3b5bff';x.lineWidth=7;x.lineCap='round';
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){const ch=grid[r][c],X=c*CS+CS/2,Y=r*CS+CS/2;

        if(c+1<C&&grid[r][c+1]=='#'){x.beginPath();x.moveTo(X,Y);x.lineTo(X+CS,Y);x.stroke()}
        if(r+1<R&&grid[r+1][c]=='#'){x.beginPath();x.moveTo(X,Y);x.lineTo(X,Y+CS);x.stroke()}}
      else if(ch=='-'){x.fillStyle='#ffb8ff';x.fillRect(c*CS,Y-2,CS,4);x.fillStyle='#3b5bff'}
      else if(ch=='.'){x.fillStyle='#ffd8b0';x.beginPath();x.arc(X,Y,2.5,0,7);x.fill();x.fillStyle='#3b5bff'}
      else if(ch=='o'&&(fr/15|0)%2==0){x.fillStyle='#ffd8b0';x.beginPath();x.arc(X,Y,6,0,7);x.fill();x.fillStyle='#3b5bff'}}
    const px=pac.x*k+CS/2,py=pac.y*k+CS/2,ang=Math.atan2(pac.d[1],pac.d[0]),mo=(pac.d[0]||pac.d[1])&&!freeze?Math.abs(Math.sin(fr/4))*.7+.05:.3;
    x.fillStyle='#ffd23f';x.beginPath();x.moveTo(px,py);x.arc(px,py,CS/2-1,ang+mo,ang+2*Math.PI-mo);x.closePath();x.fill();

      const fright=g.m=='fright';x.fillStyle=fright?(frightT<90&&(fr/8|0)%2?'#fff':'#2233ff'):g.col;
      x.beginPath();x.arc(gx,gy-1,rr,Math.PI,0);x.lineTo(gx+rr,gy+rr);
      for(let i=0;i<3;i++){x.lineTo(gx+rr-(i*2+1)*rr/3,gy+rr-4);x.lineTo(gx+rr-(i*2+2)*rr/3,gy+rr)}x.closePath();x.fill();

        x.fillStyle='#1a2a8a';x.beginPath();x.arc(gx-4+g.d[0]*1.5,gy-3+g.d[1]*1.5,1.8,0,7);x.arc(gx+4+g.d[0]*1.5,gy-3+g.d[1]*1.5,1.8,0,7);x.fill()}});

  });

{id:'sudoku',name:'Sudoku',icon:'🧩',p:1,rep:true,unit:'s',desc:'Fill the grid so every row, column and box has 1 to 9. Easy, Medium or Hard.',help:'Click a square, then type <kbd>1</kbd>–<kbd>9</kbd> or use the number pad · <kbd>Backspace</kbd> erases · <kbd>Arrows</kbd> move<br>Numbers that clash turn pink',
start(){
  const wrap=box('sudwrap');
  const ok=(g,i,v)=>{const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3;for(let k=0;k<9;k++){if(g[r*9+k]==v||g[k*9+c]==v||g[(br+(k/3|0))*9+bc+k%3]==v)return false}return true};
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  const fill=g=>{const i=g.indexOf(0);if(i<0)return true;for(const v of shuf([1,2,3,4,5,6,7,8,9]))if(ok(g,i,v)){g[i]=v;if(fill(g))return true}g[i]=0;return false};
  const count=(g,lim)=>{let bi=-1,bc=10;for(let i=0;i<81;i++)if(!g[i]){let n=0;for(let v=1;v<=9;v++)if(ok(g,i,v))n++;if(n<bc){bc=n;bi=i;if(!n)return 0}}
    if(bi<0)return 1;let n=0;for(let v=1;v<=9;v++)if(ok(g,bi,v)){g[bi]=v;n+=count(g,lim-n);if(n>=lim)break}g[bi]=0;return n};
  const make=holes=>{const sol=Array(81).fill(0);fill(sol);const puz=sol.slice();let removed=0;
    for(const i of shuf([...Array(81).keys()])){if(removed>=holes)break;const keep=puz[i];puz[i]=0;if(count(puz.slice(),2)!=1)puz[i]=keep;else removed++}return{sol,puz}};
  const LV=[['Easy',36],['Medium',46],['Hard',54]];
  let lv=0,sol,given,vals,sel=-1,t0,done=true;
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const hud=()=>{if(done||!vals)return;say(LV[lv][0]+' · '+fmt(Math.floor((Date.now()-t0)/1000))+' · '+vals.filter(v=>!v).length+' squares left'+(store.get('sudoku')?' · Best '+fmt(store.get('sudoku')):''))};
  const conflict=i=>{const v=vals[i];if(!v)return false;const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3;
    for(let k=0;k<9;k++){const a=r*9+k,b=k*9+c,d=(br+(k/3|0))*9+bc+k%3;if((a!=i&&vals[a]==v)||(b!=i&&vals[b]==v)||(d!=i&&vals[d]==v))return true}return false};
  const render=()=>{
    const sv=sel>=0?vals[sel]:0,sr=sel/9|0,sc=sel%9,sb=(sr/3|0)*3+(sc/3|0);
    wrap.innerHTML=`<div class="sudlv">${LV.map((l,i)=>`<button class="btn ${i==lv?'on':''}" data-lv="${i}">${l[0]}</button>`).join('')}</div>
      <div class="sud">${vals.map((v,i)=>{const r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0);let cl=given[i]?'gv':'us';
        if(sel>=0){if(i==sel)cl+=' sel';else if(sv&&v==sv)cl+=' same';else if(r==sr||c==sc||b==sb)cl+=' peer'}
        if(conflict(i))cl+=' bad';if(c==2||c==5)cl+=' br';if(r==2||r==5)cl+=' bb';
        return `<button class="${cl}" data-i="${i}">${v||''}</button>`}).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="0">⌫</button></div>`;
    wrap.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{say('Making a puzzle…');later(()=>newGame(+b.dataset.lv),30)});
    wrap.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render()});
    wrap.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>put(+b.dataset.n));
    hud()};
  const newGame=l=>{lv=l;const m=make(LV[l][1]);sol=m.sol;given=m.puz.map(v=>v>0);vals=m.puz.slice();sel=vals.indexOf(0);t0=Date.now();done=false;render()};
  const put=n=>{if(done||sel<0||given[sel])return;vals[sel]=n;
    if(vals.every((v,i)=>v==sol[i])){done=true;const s=Math.max(1,Math.floor((Date.now()-t0)/1000));render();
      say((bestLow('sudoku',s)?'NEW BEST! ':'')+'Solved in '+fmt(s)+'! Pick a level for a new puzzle');return}
    render()};
  this.key=(k,rep)=>{const m=/^(?:Digit|Numpad)([0-9])$/.exec(k);
    if(m){if(!rep)put(+m[1])}else if(k=='Backspace'||k=='Delete')put(0);
    else if(sel>=0&&!done){const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];if(mv!=null){const r=sel/9|0,c=sel%9;
      if((mv==-1&&c>0)||(mv==1&&c<8)||(mv==-9&&r>0)||(mv==9&&r<8)){sel+=mv;render()}}}};
  every(hud,1000);
  say('Making a puzzle…');later(()=>newGame(0),30);
}},

    if(scr=='shop'){const s=run.shop;

      if(d.rbuy!=null){const x=s.relics[+d.rbuy];if(run.gold>=x.p){run.gold-=x.p;x.sold=1;addRelic(x.k)}}

      if(d.act=='remove'){const rp=75+25*run.removes;if(run.gold>=rp)pickDeck('Choose a card to remove',()=>true,c=>{run.gold-=rp;run.removes++;s.removed=1;run.deck=run.deck.filter(x=>x!=c)})}
      render();return}
    if(scr=='event'&&d.opt!=null){const ev=run.ev,r=ev.o[+d.opt][1]();if(r!=null){run.msg={t:ev.t,i:ev.i,x:r};scr='msg'}render();return}};
  M.onmouseover=e=>{if(!C||scr!='combat')return;const t=e.target.closest('[data-e]');M.querySelectorAll('.ddu.hov').forEach(x=>x.classList.remove('hov'));if(t&&sel>=0)t.classList.add('hov')};
  this.key=k=>{if(scr!='combat'||!C)return;if(k=='Escape'){sel=-1;ov=null;render();return}if(ov)return;
    if(k=='KeyE'||k=='Enter'){endTurn();return}const m=k.match(/^Digit([1-9])$/);if(m){const i=+m[1]-1;if(i<C.hand.length){if(sel==i){sel=-1;render()}else play(i)}}};
